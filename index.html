  if(act==="auth-retry"){S.auth="checking";render(true);sb.auth.getSession().then(({data})=>{if(data&&data.session){S.me.id=null;onSignedIn(data.session.user)}else{S.auth="login";render(true)}});return}
  if(act==="pw-eye"){const inp=b.parentElement.querySelector("input");const show=inp.type==="password";inp.type=show?"text":"password";b.classList.toggle("on",show);b.setAttribute("aria-label",show?"Masquer le mot de passe":"Afficher le mot de passe");inp.focus();try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}return}
  if(act==="fid-forget"){pkSetHint(null);fidSet(null);S.auth="login";S.authErr="";render(true);return}
  if(act==="fid-unlock"||act==="fid-login"){fidGo(act==="fid-unlock");return}
  if(act==="fid-password"){fidSet(null);S.forgetMe=true;S.pendingUser=null;sb.auth.signOut();S.auth="login";render(true);return}
  if(act==="fid-on"){fidEnable().then(()=>render(true));return}
  if(act==="fid-off"){fidSet(null);toast(fidLabel()+" désactivé sur cet appareil");render(true);return}
  if(act==="fid-later"){S.fidOffer=false;try{localStorage.setItem("kicker-fid-asked3","1")}catch(e){}render(true);return}
  if(act==="fid-yes"){const pr=fidEnable();S.fidOffer=false;try{localStorage.setItem("kicker-fid-asked3","1")}catch(e){}pr.then(()=>render(true));return}
  if(act==="logout"){S.gameId=null;S.tab="games";S.groupId=null;pushForget().finally(()=>sb.auth.signOut());window.scrollTo(0,0);return}
  if(act==="copy-join"){copy(`Je t’invite dans notre groupe « ${meta().name} » sur Kicker pour organiser nos soirées poker et jeux. Je viens de te partager la page par mail : ouvre-la, crée ton profil et dis-nous si tu viens à la prochaine soirée.`);return}
  if(act==="goto-board"){S.tab="board";S.boardMode=b.dataset.m;render(true);window.scrollTo(0,0);return}
  if(act==="new-game"&&b.dataset.kind==="board"&&!b.dataset.rolled){rollIcon(b.querySelector(".dice-ic"));b.dataset.rolled="1";setTimeout(()=>{b.click();delete b.dataset.rolled},720);return}
  if(act==="new-game"){const id=uid();const kind=b.dataset.kind||"cash";const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));
    const seats={};groupPlayers().forEach(([p])=>seats[p]={rsvp:p===S.me.id?"yes":"invited"});
    const sd=smartDefaults(kind);const G0=curGroup();const nh=G0&&G0.nextHost&&S.data.players[G0.nextHost.pid]?G0.nextHost.pid:null;
    if(nh){sd.location="Chez "+pname(nh);updGroup(G=>{G.lastHost=nh;delete G.nextHost})}
    write("games",id,{title:sd.title,date:sd.date,time:sd.time,location:sd.location,type:sd.type,buyIn:sd.buyIn,gameName:sd.gameName,lowWins:sd.lowWins,rebuys:sd.rebuys,status:"planned",notes:"",seats,createdAt:Date.now(),groupId:S.groupId,createdBy:S.me.id,tz:(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Paris"}catch(e){return "Europe/Paris"}})()});
    S.tab="games";S.gameId=id;S.viewAnim="up";render(true);window.scrollTo(0,0);buzz(15);toast(sd.copied?"Partie préparée avec les réglages de la dernière fois ✓":"Partie créée : copie l’invitation pour prévenir le groupe");return}
  if(act==="set-type"){const v=b.dataset.v;const roll=v==="board";setTimeout(()=>{if(roll)rollIcon(app.querySelector(".kind.j .dice-ic"))},0);updGame(g=>{const wasB=g.type==="board";g.type=v;if(v==="board"&&g.title==="Soirée poker")g.title="Soirée jeux";if(v!=="board"&&g.title==="Soirée jeux")g.title="Soirée poker";if(v==="board"&&!wasB)g.buyIn=0;if(v!=="board"&&wasB&&!n(g.buyIn))g.buyIn=20});return}
  if(act==="set-buy"){const v=n(b.dataset.v);updGame(g=>{g.buyIn=v});return}
  if(act==="seat-move"){if(!S.canWrite){toast("Lecture seule : seul l’organisateur peut modifier.");return}
    const gid=b.dataset.gid,pid=b.dataset.seat;const g=S.data.games[gid];if(!g)return;
    const clearSel=()=>{app.querySelectorAll(".oval .seat.sel").forEach(e=>e.classList.remove("sel"));S.seatSel=null};
    if(!S.seatSel||S.seatSel.gid!==gid){clearSel();S.seatSel={gid,pid};b.classList.add("sel");toast("Touche un 2ᵉ joueur pour échanger leurs places");return}
    if(S.seatSel.pid===pid){clearSel();return}
    const first=S.seatSel.pid;clearSel();
    const pids=[...app.querySelectorAll(".oval [data-seat]")].map(e=>e.dataset.seat);const slots=seatSlots(g,pids);const N=slots.length;
    const i=slots.indexOf(first),j=slots.indexOf(pid);if(i<0||j<0)return;slots[i]=pid;slots[j]=first;
    const c=clone(g);c.seatOrder=slots;write("games",gid,c,true);
    const move=(who,k,cls)=>{const el=app.querySelector(`.oval [data-seat="${who}"]`);if(!el)return;const q=seatPos(k,N);el.style.left=q.x+"%";el.style.top=q.y+"%";
      el.classList.remove("hop","slide");void el.offsetWidth;el.classList.add(cls)};
    move(first,j,"hop");move(pid,i,"hop");return}
  if(act==="logo"){b.classList.remove("gather");void b.offsetWidth;b.classList.add("gather");return}
  if(act==="rsvp-home"){if(!S.canWrite){toast("Lecture seule : seul l’organisateur peut modifier.");return}
    const v=b.dataset.v,gid=b.dataset.id;if(seatsOf(S.data.games[gid])[S.me.id]?.rsvp===v)return;
    const g=clone(S.data.games[gid]);g.seats=g.seats||{};g.seats[S.me.id]=Object.assign({},g.seats[S.me.id],{rsvp:v});
    write("games",gid,g,true);
    b.parentElement.querySelectorAll("button").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});
    const seat=app.querySelector(`[data-seat="${S.me.id}"]`);if(seat){seat.className="seat "+v;void seat.offsetWidth;seat.classList.add("pulse")}
    const c=rsvpCounts(g);const cy=document.getElementById("cnt-yes"),cm=document.getElementById("cnt-maybe");if(cy)cy.textContent=c.yes;if(cm)cm.textContent=c.maybe;
    return}
  if(act==="rsvp"){const pid=b.dataset.pid,v=b.dataset.v;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{rsvp:v})});return}
  if(act==="quick-add-disabled"){const inp=document.getElementById("quick-player");const nm=(inp.value||"").trim();if(!nm)return;const pid=uid();
    write("players",pid,{name:nm,createdAt:Date.now()});updGame(g=>{g.seats[pid]={rsvp:"yes"};if(g.status==="live"&&g.type!=="board")g.seats[pid].in=n(g.buyIn)});return}
  if(act==="copy-invite"){copy(inviteText(S.data.games[S.gameId]));return}
  if(act==="copy-results"){copy(resultsText(S.data.games[S.gameId]));return}
  if(act==="start"){const sid=S.gameId;updGame(g=>{g.status="live";g.startedAt=Date.now();g.pausedAt=null;g.pausedTotal=0;if(g.type!=="board")Object.values(g.seats).forEach(s=>{if(s.rsvp==="yes"&&!n(s.in))s.in=n(g.buyIn)})});
    if(!Object.values(seatsOf(S.data.games[sid])).some(s=>s.rsvp==="yes")){toast("Personne n’a répondu oui : marque les présents dans « Qui vient ? ».");return}
    S.liveId=sid;S.gameId=null;render(true);window.scrollTo(0,0);return}
  if(act==="buy"){const pid=b.dataset.pid,d=+b.dataset.d;{const gg=S.data.games[S.gameId],st0=gg&&gg.seats&&gg.seats[pid];if(d>0&&gg&&!rebuyOn(gg)&&st0&&n(st0.in)>=n(gg.buyIn)){toast("Recaves désactivées pour cette soirée");return}}updGame(g=>{const s=g.seats[pid];const step=n(g.buyIn)||10;s.in=Math.max(0,Math.round((n(s.in)+d*step)*100)/100);if(s.in===0&&d<0&&s.rsvp!=="yes")delete g.seats[pid]});return}
  if(act==="finish"){const gid=S.gameId;updGame(g=>{g.status="done";g.doneAt=Date.now()});S.celebrate=gid;const tt=document.getElementById("toast");if(tt)tt.hidden=true;render(true);buzz([20,40,20]);setTimeout(confetti,60);return}
  if(act==="reopen"){updGame(g=>{g.status="live";g.stoppedAt=g.stoppedAt||Date.now()});return}
  if(act==="del-game"){S.confirm="del-game";render(true);return}
  if(act==="del-game-yes"){const id=S.gameId;S.gameId=null;S.confirm=null;write("games",id,null);return}
  if(act==="add-player"){const inp=document.getElementById("new-player");const nm=(inp.value||"").trim();if(!nm){inp.focus();return}
    const pid=uid();write("players",pid,{name:nm,createdAt:Date.now()});
    // add to upcoming games as "peut-être"
    gamesSorted().up.forEach(g=>{if(!(g.seats||{})[pid]){const c=clone(S.data.games[g.id]);c.seats=c.seats||{};c.seats[pid]={rsvp:"maybe"};write("games",g.id,c)}});
    setTimeout(()=>{const i=document.getElementById("new-player");if(i)i.focus()},0);return}
  if(act==="del-player"){S.confirm="del-"+b.dataset.pid;render(true);return}
  if(act==="del-player-yes"){const pid=b.dataset.pid;S.confirm=null;
    gamesSorted().up.forEach(g=>{const s=(g.seats||{})[pid];if(s&&!n(s.in)){const c=clone(S.data.games[g.id]);delete c.seats[pid];write("games",g.id,c)}});
    const G=clone(curGroup());delete G.members[pid];write("groups",S.groupId,G);return}
  if(act==="wipe"){S.confirm="wipe";render(true);return}
  if(act==="hub-mode"){S.hub=b.dataset.v;render(true);setTimeout(()=>{const i=document.getElementById(S.hub==="create"?"hub-name":"hub-code");if(i)i.focus()},0);return}
  if(act==="hub-home"){S.hub=null;render(true);return}
  if(act==="hub-enter"){enterGroup(b.dataset.id);return}
  if(act==="hub-create"){const nm=(document.getElementById("hub-name").value||"").trim();const e=document.getElementById("hub-err");
    if(!nm){e.textContent="Donne un nom à ton groupe.";return}if(!S.me.id){e.textContent="Impossible de t’identifier. Recharge la page.";return}
    ensurePlayer(S.me.name||"Joueur");const id=uid();
    write("groups",id,{name:nm.slice(0,40),code:newCode(),currency:document.getElementById("hub-cur").value,createdBy:S.me.id,createdAt:Date.now(),members:{[S.me.id]:{joinedAt:Date.now()}}},true);
    enterGroup(id);S.tab="players";render(true);toast("Groupe créé ! Envoie le code à tes amis.");return}
  if(act==="hub-join"){const code=(document.getElementById("hub-code").value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");const e=document.getElementById("hub-err");
    if(code.length!==6){e.textContent="Le code fait 6 caractères.";return}
    e.textContent="";b.disabled=true;b.textContent="Recherche…";
    sb.rpc("join_group",{p_code:code}).then(async({data:gid,error})=>{b.disabled=false;b.textContent="Rejoindre le groupe";
      if(error){console.warn("join_group error:",error);e.textContent="Impossible de rejoindre le groupe : "+(error.message||error.code||"erreur inconnue");return}
      if(!gid){e.textContent="Aucun groupe avec ce code. Vérifie auprès de l’organisateur.";return}
      await loadAll();const g=S.data.groups[gid];
      Object.entries(S.data.games).filter(([,x])=>x.groupId===gid&&x.status!=="done"&&!(x.seats||{})[S.me.id]).forEach(([xid,x])=>{const cc=clone(x);cc.seats=cc.seats||{};cc.seats[S.me.id]={rsvp:"invited"};write("games",xid,cc,true)});
      enterGroup(gid);toast("Bienvenue dans « "+(g?g.name:"ton groupe")+" » !")});return}
  if(act==="switch-group"){S.hubForced=true;S.groupId=null;try{localStorage.removeItem("tapisvert-group")}catch(e){}S.hub=null;S.confirm=null;render(true);window.scrollTo(0,0);return}
  if(act==="leave"){S.confirm="leave";render(true);return}
  if(act==="leave-yes"){const G=curGroup();const gid=S.groupId;S.confirm=null;
    if(G.createdBy===S.me.id||S.mode!=="shared"){Object.entries(S.data.games).filter(([,x])=>x.groupId===gid).forEach(([xid])=>write("games",xid,null,true));write("groups",gid,null,true)}
    else{const c=clone(G);delete c.members[S.me.id];write("groups",gid,c,true)}
    S.groupId=null;try{localStorage.removeItem("tapisvert-group")}catch(e){}render(true);window.scrollTo(0,0);return}
  if(act==="copy-code"){const G=curGroup();const link=APP_URL+"/?join="+G.code;const txt=`Rejoins mon groupe « ${G.name} » sur Kicker pour nos soirées poker et jeux : ${link}`;
    if(navigator.share){navigator.share({title:"Kicker",text:txt}).catch(()=>{})}else copy(txt);return}
  if(act==="wipe-yes"){S.confirm=null;Object.keys(S.data.games).forEach(id=>write("games",id,null));Object.keys(S.data.players).forEach(id=>write("players",id,null));toast("Données effacées");return}
  if(act==="t-toggle"){const t=S.timer;if(t.running){t.remaining=remaining();t.running=false;try{wake&&wake.release();wake=null}catch(e){}}
    else{if(t.remaining<=0)t.remaining=t.levels[t.idx][2]*60;t.endAt=Date.now()+t.remaining*1000;t.running=true;
      try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
      try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wake=l).catch(()=>{})}catch(e){}}
    saveTimer();render(true);return}
  if(act==="t-next"){setLevel(S.timer.idx+1);return}
  if(act==="t-prev"){setLevel(S.timer.idx-1);return}
  if(act==="t-reset"){S.timer.running=false;setLevel(0);return}
  if(act==="lv-add"){const L=S.timer.levels,l=L[L.length-1];L.push([l[1],l[1]*2,l[2]]);saveTimer();render(true);return}
  if(act==="lv-del"){const i=+b.dataset.i;S.timer.levels.splice(i,1);if(S.timer.idx>=S.timer.levels.length)S.timer.idx=S.timer.levels.length-1;saveTimer();render(true);return}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(typeof TR!=="undefined"&&TR){tourEnd();return}
  const layers=[...document.querySelectorAll(".inv-layer")];const top=layers[layers.length-1];if(!top)return;
  const c=top.querySelector('[data-act$="-close"],[data-act="del-cancel"],[data-act="stop-cancel"],[data-act="confirm-no"]');if(c){e.preventDefault();c.click()}});
app.addEventListener("keydown",e=>{if(e.key===" "&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return}
  if(e.key!=="Enter")return;
  if(e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return}
  if(e.target.id==="hub-name"){e.preventDefault();app.querySelector('[data-act="hub-create"]').click();return}
  if(e.target.id==="hub-code"){e.preventDefault();app.querySelector('[data-act="hub-join"]').click();return}
  if(/^a-/.test(e.target.id||"")){e.preventDefault();const bt=app.querySelector('[data-act="auth-signup"],[data-act="auth-login"],[data-act="auth-newpw"]');if(bt)bt.click();return}
  if(e.target.id==="new-player"){e.preventDefault();app.querySelector('[data-act="add-player"]').click()}
  if(e.target.id==="quick-player"){e.preventDefault();app.querySelector('[data-act="quick-add"]').click()}});
app.addEventListener("input",e=>{if(e.target.id==="fb-text")S.fbText=e.target.value;
  if(e.target.id==="lib-name"){const c=GAME_CAT.find(x=>x[0].toLowerCase()===e.target.value.trim().toLowerCase());if(c){const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v};set("lib-min",c[1]);set("lib-max",c[2]);const d=document.getElementById("lib-dur");if(d){d.value=[...d.options].map(o=>+o.value).reduce((a,b)=>Math.abs(b-c[3])<Math.abs(a-c[3])?b:a)}}}});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="bring-in"){e.preventDefault();const b=e.target.parentNode.querySelector('[data-act="bring-add"]');if(b)b.click()}});
app.addEventListener("change",e=>{const el=e.target;if(el.id==="ph-file"){const f=el.files&&el.files[0];el.value="";photoUpload(f);return}if(el.dataset&&el.dataset.notif){const k=el.dataset.notif;S.notif=Object.assign(notifPrefs(),{[k]:el.checked});sb.auth.updateUser({data:{notif:S.notif}}).then(({error})=>{if(error)toast("Réglage non enregistré, réessaie")});return}
  if(el.dataset.score){const pid=el.dataset.score;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{score:el.value===""?null:n(el.value)})});return}
  if(el.dataset.g==="rebuys"){const on=el.checked;const sw=el.closest(".rb-switch");if(sw){sw.querySelector(".rb-no").classList.toggle("on",!on);sw.querySelector(".rb-yes").classList.toggle("on",on)}const h=document.getElementById("rb-hint");if(h)h.textContent=on?"Montant de chaque buy-in et de chaque recave.":"Montant du buy-in. Recaves désactivées.";buzz(10);
    const g=clone(S.data.games[S.gameId]);g.rebuys=on;write("games",S.gameId,g,true);clearTimeout(S.rbT);S.rbT=setTimeout(()=>render(true),260);return}
  if(el.dataset.g){const k=el.dataset.g;const v=k==="buyIn"?n(el.value):(k==="lowWins"||k==="rebuys")?el.checked:el.value;updGame(g=>{g[k]=v});return}
  if(el.dataset.out){const pid=el.dataset.out;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{out:el.value===""?null:n(el.value)})});return}
  if(el.dataset.pname){const nm=el.value.trim();if(!nm){render(true);return}write("players",el.dataset.pname,Object.assign({},S.data.players[el.dataset.pname],{name:nm}));return}
  if(el.dataset.meta){const G=curGroup();if(!G)return;write("groups",S.groupId,Object.assign({},G,{[el.dataset.meta]:el.value.trim()||G[el.dataset.meta]}));return}
  if(el.dataset.lv!=null){const i=+el.dataset.lv,k=+el.dataset.k;const v=Math.max(k===2?1:0,Math.round(n(el.value)));S.timer.levels[i][k]=v;
    if(i===S.timer.idx&&k===2&&!S.timer.running)S.timer.remaining=v*60;saveTimer();render(true);return}
});

/* ---------- boot ---------- */
render(true);
fidAvailable().then(av=>{S.fidAvail=av;if(!av&&S.auth==="fidwelcome")S.auth="login";if(S.auth==="login"||S.auth==="locked"||S.auth==="fidwelcome")render(true)});
initAuth().catch(e=>{console.warn(e);S.auth="error";render(true)});
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("SW",e)));
})();
