<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D0F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,600..900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Kicker — salon privé : nuit profonde, feutre émeraude, velours bordeaux, laiton */
:root{
  color-scheme:dark;
  --bg:#0A0D0F; --bg-2:#10151A;
  --surface:#141A1F; --surface-2:#1C242A; --surface-3:#243037;
  --ink:#EDE5D3; --muted:#8F968F; --line:#28323A; --line-soft:rgba(237,229,211,.07);
  --felt:#0E4A37; --felt-2:#0A3527; --felt-ink:#EDE5D3;
  --velvet:#5B1A2A; --velvet-2:#3A1019;
  --gold:#D2AC67; --gold-2:#F0D69C; --gold-deep:#8A6A32;
  --chip:#C0413A; --sapphire:#2E5B8A;
  --win:#5FC593; --loss:#E0776C; --warn:#E4AE52;
  --glow-gold:0 0 0 1px rgba(210,172,103,.35),0 8px 30px -8px rgba(210,172,103,.35);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.7);
  --f-display:"Noto Serif Display","DejaVu Serif Condensed",Georgia,serif; --title:#FFFFFF; --f-body:"Manrope",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:
  radial-gradient(120% 60% at 100% -10%,rgba(91,26,42,.45),transparent 60%),
  radial-gradient(90% 50% at -10% 30%,rgba(14,74,55,.35),transparent 60%),
  radial-gradient(80% 40% at 50% 110%,rgba(46,91,138,.18),transparent 70%),
  var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:linear-gradient(45deg,var(--line-soft) 25%,transparent 25%,transparent 75%,var(--line-soft) 75%),linear-gradient(45deg,var(--line-soft) 25%,transparent 25%,transparent 75%,var(--line-soft) 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;mask-image:linear-gradient(to bottom,#000,transparent 70%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%)}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;font-stretch:72%;text-wrap:balance;margin:0;letter-spacing:0}
h1{font-size:30px;color:var(--title);text-shadow:0 2px 0 rgba(0,0,0,.45)}
h2{font-size:18px;margin-bottom:10px;color:var(--title)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .win{color:var(--win)} .loss{color:var(--loss)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
section.block{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.sec-title{display:flex;align-items:center;gap:10px;margin:0}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-deep),transparent)}
.sec-title h2{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;font-weight:700;background:var(--surface-3);border:1px solid var(--line);min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--gold-deep)}
.btn.primary{background:linear-gradient(180deg,#E7C888,var(--gold) 50%,#B38D4C);color:#1E1608;border-color:#E9CF94;box-shadow:0 6px 20px -8px rgba(210,172,103,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.danger{background:transparent;color:var(--loss);border:1px solid rgba(224,119,108,.35)}
.btn.small{padding:6px 11px;min-height:34px;font-size:13px}
.btn.icon{width:38px;height:38px;min-height:38px;padding:0;font-size:20px;border-radius:50%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#5E665F}
input[type=checkbox]{accent-color:var(--gold)}
textarea{min-height:64px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.collapse{grid-template-columns:1fr}}
.banner{font-size:13px;padding:9px 12px;border-radius:12px;background:rgba(210,172,103,.08);border:1px solid rgba(210,172,103,.22);color:var(--gold-2);margin-bottom:14px}

/* ===== Accueil ===== */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand .mark{display:flex;align-items:center;gap:12px;min-width:0}
.chipstack{position:relative;width:44px;height:44px;flex:none}
.chipstack i{position:absolute;left:0;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0 38%,#EDE5D3 39% 41%,var(--c) 42% 60%,transparent 61%),repeating-conic-gradient(var(--c) 0 22.5deg,#EDE5D3 22.5deg 45deg);
  box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.25)}
.chipstack i:nth-child(1){--c:var(--velvet);top:6px;left:6px;transform:scale(.8)}
.chipstack i:nth-child(2){--c:var(--felt);top:0;left:-2px;transform:scale(.86) rotate(12deg)}
.chipstack i:nth-child(3){--c:var(--chip);top:-5px;left:3px;transform:scale(.9) rotate(-8deg)}
.brand .name{font-family:var(--f-display);font-weight:900;font-stretch:68%;font-size:30px;letter-spacing:.01em;line-height:1;color:var(--title);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.brand .grp{font-size:12px;color:var(--muted);margin-top:3px}
.suits{font-family:var(--f-display);letter-spacing:.35em;color:var(--gold-deep);font-size:12px}

/* Table ovale */
.table-wrap{position:relative;padding:34px 22px 40px;border-radius:26px;background:linear-gradient(180deg,var(--velvet),var(--velvet-2));border:1px solid rgba(210,172,103,.25);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.table-wrap::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px);pointer-events:none}
.marquee{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;pointer-events:none}
.marquee.bot{top:auto;bottom:10px}
.marquee b{width:5px;height:5px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 6px 1px rgba(240,214,156,.7);opacity:.35}
@media (prefers-reduced-motion:no-preference){.marquee b{animation:bulb 2.4s infinite}.marquee b:nth-child(odd){animation-delay:1.2s}}
@keyframes bulb{0%,100%{opacity:.25}50%{opacity:1}}
.oval{position:relative;aspect-ratio:1.55/1;max-width:100%;border-radius:50%/50%;
  background:radial-gradient(ellipse at 50% 40%,#17684D 0%,var(--felt) 45%,var(--felt-2) 100%);
  box-shadow:0 0 0 8px #2A1A10,0 0 0 10px var(--gold-deep),0 0 0 12px #1A0F09,0 18px 40px -10px rgba(0,0,0,.8),inset 0 0 40px rgba(0,0,0,.5)}
.oval::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(240,214,156,.18)}
.oval .center{position:absolute;inset:18% 16%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;cursor:pointer;border-radius:50%;color:var(--felt-ink)}
.oval .center .eyebrow{color:rgba(237,229,211,.65);font-size:9.5px}
.oval .center .t{font-family:var(--f-display);font-stretch:72%;font-weight:800;color:var(--title);font-size:clamp(15px,4.4vw,21px);line-height:1.15;text-wrap:balance}
.oval .center .d{font-size:12px;opacity:.8}
.count{display:flex;gap:6px;margin-top:6px}
.count span{background:rgba(0,0,0,.35);border:1px solid rgba(240,214,156,.25);border-radius:8px;padding:3px 7px;min-width:40px}
.count b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--gold-2);line-height:1.1}
.count small{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:0;cursor:pointer;z-index:1;-webkit-tap-highlight-color:transparent}
.seat.hop{z-index:3}
.seat.sel{z-index:4}
.seat.sel .avatar{box-shadow:0 0 0 2px #0A0D0F,0 0 0 4px var(--gold-2),0 0 20px rgba(240,214,156,.9)!important;filter:none!important;opacity:1!important}
.seat.sel em{color:var(--gold-2)}
@media (prefers-reduced-motion:no-preference){.seat.sel .avatar{animation:seatPulse 1s ease-in-out infinite}}
@keyframes seatPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:no-preference){
  .seat{transition:left .55s cubic-bezier(.34,1.3,.5,1),top .55s cubic-bezier(.34,1.3,.5,1)}
  .seat.hop .avatar{animation:seatHop .55s ease}
  .seat.slide .avatar{animation:seatSlide .55s ease}
  .seat:active .avatar{transform:scale(.92)}}
@keyframes seatHop{0%{transform:scale(1)}40%{transform:scale(1.28) translateY(-6px);box-shadow:0 0 0 2px #0A0D0F,0 0 0 3.5px var(--gold),0 0 22px rgba(240,214,156,.8)}100%{transform:scale(1)}}
@keyframes seatSlide{0%{transform:scale(1)}50%{transform:scale(.82);opacity:.7}100%{transform:scale(1)}}
.seat .avatar{width:34px;height:34px;box-shadow:0 0 0 2px #0A0D0F,0 0 0 3.5px var(--ring,transparent)}
.seat.yes{--ring:var(--gold)}
.seat.yes .avatar{box-shadow:0 0 0 2px #0A0D0F,0 0 0 3.5px var(--gold),0 0 14px rgba(210,172,103,.55)}
.seat.maybe .avatar{opacity:.8;box-shadow:0 0 0 2px #0A0D0F,0 0 0 3px transparent;outline:1.5px dashed var(--gold);outline-offset:1px}
.seat.no .avatar,.seat.none .avatar,.seat.invited .avatar{filter:grayscale(1);opacity:.35}
.seat em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
.table-meta{display:flex;justify-content:space-between;gap:10px;margin-top:22px;position:relative;flex-wrap:wrap}
.table-meta .chip{background:rgba(0,0,0,.3);border:1px solid rgba(240,214,156,.2);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.my-rsvp{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.empty-table{position:relative;text-align:center;padding:10px 0 4px}

/* Actions rapides */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qa{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 12px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-3),var(--surface));text-align:left;min-height:96px}
.qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-weight:800}
.qa b{font-size:13px;line-height:1.2}
.qa small{font-size:11px;color:var(--muted)}
.qa.p .ic{background:rgba(192,65,58,.18);color:#F08C84;border:1px solid rgba(192,65,58,.4)}
.qa.j .ic{background:rgba(46,91,138,.2);color:#8DB6E3;border:1px solid rgba(46,91,138,.45)}
.qa.t .ic{background:rgba(210,172,103,.14);color:var(--gold-2);border:1px solid rgba(210,172,103,.35)}
.qa:hover{border-color:var(--gold-deep)}
@media (max-width:380px){.qa small{display:none}}

/* Jackpot / stats */
.jackpot{position:relative;border-radius:18px;padding:16px;background:linear-gradient(180deg,#171109,#0E0B07);border:1px solid rgba(210,172,103,.35);box-shadow:var(--glow-gold);text-align:center;overflow:hidden}
.jackpot::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 50% 0%,rgba(240,214,156,.16),transparent 70%)}
.jackpot .v{position:relative;font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em;color:var(--gold-2);text-shadow:0 0 18px rgba(240,214,156,.35)}
.jackpot .eyebrow{position:relative;color:var(--gold)}
.jackpot .sub{position:relative;font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;margin-top:3px;color:var(--ink)}
@media (max-width:420px){.stat b{font-size:15px}}

/* Champions */
.champs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.champ{position:relative;border-radius:16px;padding:14px;border:1px solid var(--line);overflow:hidden;min-width:0;text-align:left;width:100%}
.champ.poker{background:linear-gradient(150deg,rgba(192,65,58,.22),var(--surface) 60%)}
.champ.jeux{background:linear-gradient(150deg,rgba(46,91,138,.28),var(--surface) 60%)}
.champ .suit{position:absolute;right:-6px;top:-18px;font-family:var(--f-display);font-size:86px;line-height:1;opacity:.1;pointer-events:none}
.champ .who{display:flex;align-items:center;gap:10px;margin-top:10px}
.champ .avatar{width:40px;height:40px;font-size:15px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
.champ .nm{font-weight:800;font-size:15px}
.champ .sc{font-family:var(--f-mono);font-size:13px}
@media (max-width:350px){.champs{grid-template-columns:1fr}}

/* Listes */
.list{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.item:first-child{border-top:0}
button.item:hover{background:rgba(210,172,103,.05)}
.date-tile{width:48px;flex:none;text-align:center;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);padding:5px 0;line-height:1.1}
.date-tile b{display:block;font-family:var(--f-display);font-size:18px;color:var(--gold-2)}
.date-tile span{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.date-tile.k-board{border-color:rgba(46,91,138,.5)}
.date-tile.k-poker{border-color:rgba(192,65,58,.45)}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.live{background:var(--chip);color:#fff;border-color:transparent;box-shadow:0 0 12px rgba(192,65,58,.6)}
.pill.planned{background:rgba(95,197,147,.1);color:var(--win);border-color:rgba(95,197,147,.3)}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:var(--f-display);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.12)}

/* RSVP */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on[data-v="yes"]{background:linear-gradient(180deg,#E7C888,var(--gold));color:#1E1608}
.seg button.on[data-v="maybe"]{background:var(--surface-3);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.seg button.on[data-v="no"]{background:rgba(224,119,108,.18);color:var(--loss)}

/* Caisse */
.cash{display:grid;grid-template-columns:minmax(0,1fr) auto 92px;gap:8px 10px;align-items:center}
.cash .hd{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .val{min-width:58px;text-align:center;font-weight:700;color:var(--gold-2)}
.cash input{text-align:right;font-family:var(--f-mono);padding:8px}
.net{font-size:12px}
@media (max-width:480px){.cash{grid-template-columns:1fr 96px}.cash .who{grid-column:1/-1;margin-top:6px}.cash .hd.h-who{display:none}.cash .hd.h-mis{text-align:left!important}.stepper .btn.icon{width:34px;height:34px;min-height:34px}}
.check{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--surface-2);flex-wrap:wrap}
.check.bad{background:rgba(228,174,82,.12);color:var(--warn);border:1px solid rgba(228,174,82,.3)}
.check.ok{background:rgba(95,197,147,.1);color:var(--win);border:1px solid rgba(95,197,147,.3)}
.transfer{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.transfer:first-child{border-top:0}
.arrow{color:var(--gold)}

/* Classement */
.rank{width:26px;text-align:center;font-family:var(--f-display);font-weight:800;color:var(--muted);flex:none}
.rank.r1{color:var(--gold-2);text-shadow:0 0 10px rgba(240,214,156,.5)}
.bar{height:6px;border-radius:3px;background:var(--bg-2);position:relative;margin-top:6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}

/* Timer */
.clock{position:relative;background:radial-gradient(ellipse at 50% 30%,#17684D,var(--felt) 50%,var(--felt-2));color:var(--felt-ink);border-radius:24px;padding:24px 18px;text-align:center;border:1px solid rgba(210,172,103,.3);box-shadow:var(--shadow),inset 0 0 40px rgba(0,0,0,.45)}
.clock .time{font-family:var(--f-mono);font-weight:700;font-size:clamp(56px,18vw,96px);line-height:1;letter-spacing:-.02em;color:var(--gold-2);text-shadow:0 0 24px rgba(240,214,156,.3)}
.clock .blinds{font-family:var(--f-display);font-size:clamp(24px,7vw,34px);margin-top:10px}
.clock .eyebrow{color:rgba(237,229,211,.65)}
.progress{height:6px;background:rgba(0,0,0,.35);border-radius:3px;margin-top:18px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-2));width:0}
.levels{display:grid;grid-template-columns:28px 1fr 1fr 1fr 64px 34px;gap:6px;align-items:center}
.levels input{padding:7px;text-align:right;font-family:var(--f-mono);font-size:13px}
.levels .cur{color:var(--gold-2);font-weight:700}

/* Fiche soirée */
.ticket{position:relative;overflow:hidden;border-radius:22px;padding:30px 18px 20px;background:linear-gradient(170deg,var(--velvet),var(--velvet-2));border:1px solid rgba(210,172,103,.3);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
.ticket::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px);pointer-events:none}
.ticket>*{position:relative}
.ticket .marquee{position:absolute}
.ticket-kind{color:var(--gold-2)}

<script>
(function(){
const COLORS=["#8C2F39","#1F6B52","#2E5B8A","#9A6B2F","#5E3A8C","#1C6F73","#8A3A6A","#56662A"];
const S={data:{players:{},games:{},meta:{},groups:{}},groupId:(()=>{try{return localStorage.getItem("tapisvert-group")}catch(e){return null}})(),hub:null,mode:"loading",canWrite:true,me:{id:null,name:"",avatarUrl:""},isOwner:false,auth:"checking",account:null,tab:"games",gameId:null,confirm:null,
  timer:loadTimer()};
const pending={};
let db=null,needsRender=false;
const app=document.getElementById("app");

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const meta=()=>{const g=curGroup();return g?{name:g.name||"Mon groupe",currency:g.currency||"$"}:{name:"Kicker",currency:"$"}};
const cur=()=>meta().currency||"$";
const n=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:0};
function money(v,signed){const a=Math.abs(v);const s=a.toLocaleString("fr-FR",{maximumFractionDigits:2});
  const sign=signed?(v>0.004?"+":v<-0.004?"−":""):(v<0?"−":"");return sign+s+" "+cur();}
function colorFor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function avatar(pid){const p=S.data.players[pid];const nm=p?p.name:"?";return `<span class="avatar" style="background:${colorFor(pid)}">${esc(nm.trim().charAt(0).toUpperCase()||"?")}</span>`}
const pname=pid=>S.data.players[pid]?.name||"Joueur supprimé";
function dateParts(d){if(!d)return{day:"?",mon:""};const dt=new Date(d+"T12:00:00");return{day:dt.getDate(),mon:dt.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")}}
function longDate(g){if(!g.date)return"Date à fixer";const dt=new Date(g.date+"T12:00:00");
  let s=dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});s=s.charAt(0).toUpperCase()+s.slice(1);
  return g.time?s+" · "+g.time.replace(":","h"):s}
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copié — colle-le dans ton groupe")}catch(e){
  S.copyFallback=text;render(true);}}

/* ---------- stockage : Supabase ---------- */
const SB_URL="https://qswhsawqhesobdyqcnvq.supabase.co";
const SB_KEY="sb_publishable_PELSbEu3ZWpMG_VZ5GdCiw_KE2KhzPv";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const TABLES=["players","games","groups"];
function sbRow(coll,id,data){const r={id,data,updated_at:new Date().toISOString()};if(coll==="games")r.group_id=data.groupId||null;if(coll==="groups")r.code=data.code||null;return r}
function write(coll,id,data,silent){
  if(data===null)delete S.data[coll][id];else S.data[coll][id]=data;
  if(!silent)render(true);
  const path=coll+"/"+id;const p=pending[path]||(pending[path]={});
  p.data=data===null?null:clone(data);p.dirty=true;clearTimeout(p.t);p.t=setTimeout(()=>flush(path),350);
}
async function flush(path){
  const p=pending[path];if(!p||p.inflight||!p.dirty)return;
  p.inflight=true;p.dirty=false;const data=p.data;const [coll,id]=path.split("/");
  try{
    if(data===null){const {error}=await sb.from(coll).delete().eq("id",id);if(error)throw error}
    else{const row=sbRow(coll,id,data);const {data:upd,error}=await sb.from(coll).update(row).eq("id",id).select("id");if(error)throw error;
      if(!upd||!upd.length){const {error:e2}=await sb.from(coll).insert(row);if(e2)throw e2}}
  }catch(e){console.warn(e);toast(e&&e.code==="23505"?"Ce code existe déjà, réessaie.":"Échec de l’enregistrement. Vérifie ta connexion.")}
  p.inflight=false;if(p.dirty)flush(path);else delete pending[path];
}
async function loadAll(){
  for(const t of TABLES){const {data,error}=await sb.from(t).select("id,data");if(error)throw error;
    const o={};(data||[]).forEach(r=>{o[r.id]=r.data});
    for(const path in pending){const [c,id]=path.split("/");if(c!==t)continue;if(pending[path].data===null)delete o[id];else o[id]=pending[path].data}
    S.data[t]=o}
}
let sbChannel=null;
function subscribeAll(){
  if(sbChannel)return;sbChannel=sb.channel("kicker-live");
  TABLES.forEach(t=>sbChannel.on("postgres_changes",{event:"*",schema:"public",table:t},pl=>{
    const id=(pl.new&&pl.new.id)||(pl.old&&pl.old.id);if(!id||pending[t+"/"+id])return;
    const isNew=t==="games"&&pl.eventType==="INSERT"&&!S.data.games[id];
    if(pl.eventType==="DELETE")delete S.data[t][id];else S.data[t][id]=pl.new.data;
    if(isNew&&document.hidden&&pendingInvites().some(g=>g.id===id))sysNotify(Object.assign({id},pl.new.data));
    render()}));
  sbChannel.subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.auth==="ok")loadAll().then(()=>render()).catch(()=>{})});
}

/* ---------- domain ---------- */
function gamesSorted(){const gs=Object.entries(S.data.games).filter(([,g])=>g.groupId&&g.groupId===S.groupId).map(([id,g])=>Object.assign({id},g));
  const up=gs.filter(g=>g.status!=="done").sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
  const past=gs.filter(g=>g.status==="done").sort((a,b)=>(b.date||"").localeCompare(a.date||""));return{up,past}}
function seatsOf(g){return g.seats||{}}
function playing(g){return Object.entries(seatsOf(g)).filter(([pid,s])=>s.rsvp==="yes"||n(s.in)>0).map(([pid,s])=>Object.assign({pid},s))}
function results(g){return playing(g).map(s=>({pid:s.pid,in:n(s.in),out:s.out===""||s.out==null?null:n(s.out),net:(s.out===""||s.out==null?0:n(s.out))-n(s.in)}))}
function settle(rs){
  const cred=[],debt=[];rs.forEach(r=>{const v=Math.round(r.net*100)/100;if(v>0)cred.push({pid:r.pid,v});else if(v<0)debt.push({pid:r.pid,v:-v})});
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);const t=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const x=Math.min(debt[i].v,cred[j].v);if(x>0.004)t.push({from:debt[i].pid,to:cred[j].pid,v:Math.round(x*100)/100});
    debt[i].v-=x;cred[j].v-=x;if(debt[i].v<0.005)i++;if(cred[j].v<0.005)j++}return t}
function leaderboard(){
  const m={};const past=gamesSorted().past.filter(g=>g.type!=="board");let biggest=null;
  past.forEach(g=>{const rs=results(g).filter(r=>r.in>0||r.out!=null);if(!rs.length)return;
    const top=rs.reduce((a,b)=>b.net>a.net?b:a);
    rs.forEach(r=>{const e=m[r.pid]||(m[r.pid]={pid:r.pid,net:0,games:0,wins:0,in:0,best:-Infinity});
      e.net+=r.net;e.games++;e.in+=r.in;if(r.net>e.best)e.best=r.net;if(r===top&&r.net>0)e.wins++;
      if(!biggest||r.net>biggest.net)biggest={pid:r.pid,net:r.net,g}});});
  return{rows:Object.values(m).sort((a,b)=>b.net-a.net),biggest,count:past.length}
}
function scoresOf(g){return playing(g).map(s=>({pid:s.pid,score:s.score===""||s.score==null?null:n(s.score)}))}
function winners(g){const sc=scoresOf(g).filter(r=>r.score!=null);if(!sc.length)return[];
  const best=g.lowWins?Math.min(...sc.map(r=>r.score)):Math.max(...sc.map(r=>r.score));return sc.filter(r=>r.score===best).map(r=>r.pid)}
function boardStats(){const m={},games={};const past=gamesSorted().past.filter(g=>g.type==="board");
  past.forEach(g=>{const sc=scoresOf(g).filter(r=>r.score!=null);if(!sc.length)return;const w=winners(g);const nm=(g.gameName||"Jeu").trim();games[nm]=(games[nm]||0)+1;
    sc.forEach(r=>{const e=m[r.pid]||(m[r.pid]={pid:r.pid,games:0,wins:0,byGame:{}});e.games++;if(w.includes(r.pid)){e.wins++;e.byGame[nm]=(e.byGame[nm]||0)+1}})});
  const rows=Object.values(m).sort((a,b)=>b.wins-a.wins||(b.wins/b.games)-(a.wins/a.games));
  const fav=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];return{rows,count:past.length,fav,nGames:Object.keys(games).length}}
const kindLabel=g=>g.type==="board"?(g.gameName||"Jeu de société"):g.type==="tournoi"?"Poker · Tournoi":"Poker · Cash game";

/* ---------- views ---------- */
function banner(){
  if(S.mode==="local")return `<div class="banner">Mode local : les données restent sur cet appareil.</div>`;
  if((S.mode==="shared"||S.mode==="loading-shared")&&!S.canWrite)return `<div class="banner">Lecture seule : seul l’organisateur peut modifier les soirées.</div>`;
  return "";
}
function rsvpCounts(g){const c={yes:0,maybe:0,no:0};Object.values(seatsOf(g)).forEach(s=>{if(c[s.rsvp]!=null)c[s.rsvp]++});return c}
function statusPill(g){return g.status==="live"?`<span class="pill live">En cours</span>`:g.status==="done"?`<span class="pill">Terminée</span>`:`<span class="pill planned">Prévue</span>`}

function countdown(g){if(g.status==="live")return null;if(!g.date)return null;
  const t=new Date(g.date+"T"+(g.time||"20:00")+":00").getTime()-Date.now();if(t<=0)return{over:true};
  return{d:Math.floor(t/864e5),h:Math.floor(t/36e5)%24,m:Math.floor(t/6e4)%60}}
function seatPos(i,N){const ang=(-90+i*360/N)*Math.PI/180;return{x:(50+50*Math.cos(ang)).toFixed(2),y:(50+50*Math.sin(ang)).toFixed(2)}}
function seatSlots(g,pids){const N=Math.max(pids.length,6);const slots=Array(N).fill(null);const set=new Set(pids);const placed=new Set();
  (g.seatOrder||[]).forEach((pid,i)=>{if(pid&&i<N&&set.has(pid)&&!placed.has(pid)&&!slots[i]){slots[i]=pid;placed.add(pid)}});
  pids.forEach(pid=>{if(placed.has(pid))return;const k=slots.indexOf(null);if(k>=0){slots[k]=pid;placed.add(pid)}});return slots}
function logo(cls){const ready=S.auth==="ok"&&S.mode!=="loading"&&S.mode!=="loading-shared";if(ready&&!S.logoT)S.logoT=setTimeout(()=>{S.logoDone=true},2200);
  return `<button class="chipstack ${cls} ${S.logoDone?"":"gather"}" data-act="logo" aria-label="Kicker"><i></i><i></i><i></i></button>`}
function tableHero(next){S.seatSel=null;
  const bulbs=`<b style="animation-delay:-${Date.now()%2400}ms"></b><b style="animation-delay:-${(Date.now()+1200)%2400}ms"></b>`.repeat(7);
  let h=`<div class="table-wrap rise"><div class="marquee">${bulbs}</div><div class="marquee bot">${bulbs}</div>`;
  if(!next){return h+`<div class="oval"><div class="center"><span class="eyebrow">Table libre</span><div class="t">Aucune soirée prévue</div>${S.canWrite?`<button class="btn primary small" data-act="new-game" data-kind="cash" style="margin-top:8px">Ouvrir une table</button>`:""}</div></div></div>`}
  const seats=seatsOf(next);const order={yes:0,maybe:1,no:2};
  const ps=groupPlayers().map(([pid,p])=>({pid,name:p.name,r:seats[pid]?.rsvp||"none"}))
    .sort((a,b)=>((a.r==='none')-(b.r==='none'))||a.name.localeCompare(b.name)).slice(0,10);
  const slots=seatSlots(next,ps.map(p=>p.pid));const N=slots.length;const byPid={};ps.forEach(p=>byPid[p.pid]=p);
  const seatHtml=slots.map((pid,i)=>{if(!pid)return"";const p=byPid[pid];const q=seatPos(i,N);
    return `<button class="seat ${p.r}" data-seat="${p.pid}" data-act="seat-move" data-gid="${next.id}" style="left:${q.x}%;top:${q.y}%" aria-label="Échanger la place de ${esc(p.name)}">${avatar(p.pid)}<em>${esc(p.name.split(" ")[0])}</em></button>`}).join("");
  const cd=countdown(next);const c=rsvpCounts(next);
  let cdh="";if(next.status==="live")cdh=`<span class="pill live" style="margin-top:6px">Partie en cours</span>`;
  else if(cd&&cd.over)cdh=`<span class="pill" style="margin-top:6px">C’est l’heure</span>`;
  else if(cd)cdh=`<div class="count" aria-label="Compte à rebours"><span><b id="cd-d">${cd.d}</b><small>jours</small></span><span><b id="cd-h">${String(cd.h).padStart(2,"0")}</b><small>h</small></span><span><b id="cd-m">${String(cd.m).padStart(2,"0")}</b><small>min</small></span></div>`;
  h+=`<div class="oval">${seatHtml}<div class="center" data-act="open-game" data-id="${next.id}" role="button" tabindex="0">
      <span class="eyebrow">${esc(kindLabel(next))}</span><div class="t">${esc(next.title||"Soirée jeux")}</div><div class="d">${esc(longDate(next))}</div>${cdh}</div></div>
    <div class="table-meta"><div class="chips"><span class="chip"><i style="background:var(--gold)"></i><b id="cnt-yes" style="font-weight:inherit">${c.yes}</b>&nbsp;à table</span><span class="chip"><i style="background:var(--muted)"></i><b id="cnt-maybe" style="font-weight:inherit">${c.maybe}</b>&nbsp;peut-être</span></div>
    <div class="chips">${next.location?`<span class="chip">${esc(next.location)}</span>`:""}${next.type!=="board"||n(next.buyIn)>0?`<span class="chip num">${money(n(next.buyIn))}${next.type==="board"?" / joueur":""}</span>`:""}</div></div>
    ${S.me.id&&S.data.players[S.me.id]&&next.status!=="live"?`<div class="my-rsvp"><span class="eyebrow" style="color:var(--gold-2)">Tu viens ?</span><div class="seg">${[["yes","Oui"],["maybe","Peut-être"],["no","Non"]].map(([v,l])=>`<button data-act="rsvp-home" data-id="${next.id}" data-v="${v}" class="${seats[S.me.id]?.rsvp===v?"on":""}">${l}</button>`).join("")}</div></div>`:""}
    <div style="position:relative;margin-top:14px;display:flex;justify-content:center"><button class="btn primary" data-act="open-game" data-id="${next.id}">${next.status==="live"?"Ouvrir la caisse":"Voir la soirée"}</button></div></div>`;
  return h;
}
function viewGames(){
  const m=meta();const {up,past}=gamesSorted();const next=up[0];
  let h=`<div class="brand rise"><div class="mark">${logo("")}<div style="min-width:0"><div class="name">KICKER</div><button class="grp grp-switch ellipsis" data-act="switch-group" aria-label="Changer de groupe">${esc(m.name)} <span aria-hidden="true">▾</span></button></div></div><div class="row" style="gap:10px">${bell()}</div></div>${banner()}`;
  if(S.mode==="loading"||S.mode==="loading-shared")return h+`<div class="empty">Ouverture du salon…</div>`;
  h+=tableHero(next);
  if(S.canWrite)h+=`<div class="quick rise d2">
    <button class="qa p" data-act="new-game" data-kind="cash"><span class="ic">♠&#xFE0E;</span><b>Soirée poker</b><small>Cash game ou tournoi</small></button>
    <button class="qa j" data-act="new-game" data-kind="board"><span class="ic dice-ic">${miniDice()}</span><b>Soirée jeux</b><small>Catan, Skyjo, Uno…</small></button>
    <button class="qa t" data-act="goto-timer"><span class="ic">◷</span><b>Blindes</b><small>Timer de tournoi</small></button></div>`;
  const lb=leaderboard(),bs=boardStats();const pot=lb.rows.reduce((a,r)=>a+r.in,0);
  const actives=groupPlayers().length;
  h+=`<section class="block rise d3"><div class="jackpot"><div class="eyebrow">Argent mis en jeu</div><div class="v">${money(pot)}</div><div class="sub">${lb.count} soirée${lb.count>1?"s":""} poker · ${bs.count} partie${bs.count>1?"s":""} de jeux</div></div>
    <div class="stats"><div class="stat"><span class="eyebrow">Joueurs</span><b>${actives}</b></div><div class="stat"><span class="eyebrow">Record</span><b class="win">${lb.biggest?money(lb.biggest.net,true):"—"}</b></div><div class="stat"><span class="eyebrow">Jeu favori</span><b class="ellipsis" style="font-family:var(--f-body);font-weight:800">${bs.fav?esc(bs.fav[0]):"—"}</b></div></div></section>`;
  const pk=lb.rows[0],jx=bs.rows[0];
  if(pk||jx)h+=`<section class="block rise d4"><div class="sec-title"><h2>Les champions</h2></div><div class="champs">
    ${pk?`<button class="champ poker" data-act="goto-board" data-m="poker"><span class="suit" aria-hidden="true">♠&#xFE0E;</span><span class="eyebrow">Roi du poker</span><div class="who">${avatar(pk.pid)}<div style="min-width:0"><div class="nm ellipsis">${esc(pname(pk.pid))}</div><div class="sc ${pk.net>=0?"win":"loss"}">${money(pk.net,true)}</div></div></div></button>`:""}
    ${jx?`<button class="champ jeux" data-act="goto-board" data-m="board"><span class="suit" aria-hidden="true">♦&#xFE0E;</span><span class="eyebrow">Champion des jeux</span><div class="who">${avatar(jx.pid)}<div style="min-width:0"><div class="nm ellipsis">${esc(pname(jx.pid))}</div><div class="sc" style="color:var(--gold-2)">${jx.wins} victoire${jx.wins>1?"s":""}</div></div></div></button>`:""}
  </div></section>`;
  if(up.length>1){h+=`<section class="block"><div class="sec-title"><h2>À venir</h2></div><div class="list">${up.slice(1).map(gameRow).join("")}</div></section>`}
  h+=`<section class="block"><div class="sec-title"><h2>Historique</h2></div>${past.length?`<div class="list">${past.map(gameRow).join("")}</div>`:`<div class="card empty">Les soirées terminées apparaîtront ici avec leurs résultats.</div>`}</section>`;
  return h;
}
function gameRow(g){const d=dateParts(g.date);let right=statusPill(g);
  if(g.status==="done"&&g.type==="board"){const w=winners(g);if(w.length)right=`<div style="text-align:right"><div style="font-weight:700;color:var(--gold)">${esc(w.map(pname).join(", "))}</div><div class="muted" style="font-size:12px">${w.length>1?"ex æquo":"gagne"}</div></div>`}
  else if(g.status==="done"){const rs=results(g);if(rs.length){const top=rs.reduce((a,b)=>b.net>a.net?b:a);right=`<div style="text-align:right"><div class="num win" style="font-weight:700">${money(top.net,true)}</div><div class="muted" style="font-size:12px">${esc(pname(top.pid))}</div></div>`}}
  const c=rsvpCounts(g);
  return `<button class="item" data-act="open-game" data-id="${g.id}"><div class="date-tile ${g.type==="board"?"k-board":"k-poker"}"><b>${d.day}</b><span>${d.mon}</span></div>
    <div class="grow"><div class="ellipsis" style="font-weight:600">${esc(g.title||"Soirée jeux")}</div><div class="muted ellipsis" style="font-size:13px">${esc(kindLabel(g))} · ${g.status==="done"?playing(g).length+" joueurs":c.yes+" confirmés"}</div></div>${right}</button>`}

function viewGame(){
  const g=S.data.games[S.gameId];if(!g){S.gameId=null;return viewGames()}
  const id=S.gameId,w=S.canWrite,dis=w?"":"disabled";const seats=seatsOf(g);const players=groupPlayers().sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const bulbs='<b></b>'.repeat(12);const isB=g.type==="board";const bi=n(g.buyIn);
  const presets=isB?[0,2,5,10,20]:[5,10,20,50,100];
  const pc=v=>v===0?"#56605A":v<=5?"#2E5B8A":v<=10?"#1F6B52":v<=20?"#8C2F39":v<=50?"#5E3A8C":"#16181C";
  let h=`<div class="row between" style="margin-bottom:14px"><button class="btn small" data-act="back">← Soirées</button>${statusPill(g)}</div>${banner()}`;
  h+=`<div class="ticket rise"><div class="marquee">${bulbs}</div>
    <span class="eyebrow ticket-kind">${esc(kindLabel(g))}</span>
    <input id="g-title" class="ticket-title" data-g="title" value="${esc(g.title)}" ${dis} placeholder="Nom de la soirée" aria-label="Nom de la soirée" maxlength="48">
    <div class="ticket-grid">
      <label class="tf"><span>Date</span><input id="g-date" type="date" data-g="date" value="${esc(g.date)}" ${dis}></label>
      <label class="tf"><span>Heure</span><input id="g-time" type="time" data-g="time" value="${esc(g.time)}" ${dis}></label>
      <label class="tf full"><span>Lieu</span><input id="g-loc" data-g="location" value="${esc(g.location)}" ${dis} placeholder="Chez qui ?"></label>
    </div></div>`;
  h+=`<section class="block"><div class="sec-title"><h2>Le jeu</h2></div>
    <div class="kinds">${[["cash","♠","Cash game","Poker","p"],["tournoi","♣","Tournoi","Poker","t"],["board","♦","Jeu de société","Catan, Skyjo…","j"]].map(([v,s,l,sub,c])=>`<button class="kind ${c} ${((g.type||"cash")===v)?"on":""}" data-act="set-type" data-v="${v}" ${dis} aria-pressed="${(g.type||"cash")===v}">${v==="board"?`<span class="ic dice-ic">${miniDice()}</span>`:`<span class="ic">${s}&#xFE0E;</span>`}<b>${l}</b><small>${sub}</small></button>`).join("")}</div>
    ${isB?`<label class="field">Nom du jeu<input id="g-gname" data-g="gameName" value="${esc(g.gameName)}" ${dis} placeholder="Catan, Uno, Skyjo…" list="known-games"></label><datalist id="known-games">${["Catan","Uno","Skyjo","Tarot","Belote","Scrabble","Monopoly","Dixit","Codenames","7 Wonders","Les Aventuriers du Rail","Loup-Garou","Rami","Yams","Échecs",...new Set(Object.values(S.data.games).map(x=>x.gameName).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}

function boardMoney(g){const stake=n(g.buyIn);if(stake<=0)return null;const sc=scoresOf(g);if(!sc.length||sc.some(r=>r.score==null))return{stake,pot:stake*sc.length,rs:null};
  const w=winners(g),pot=stake*sc.length,share=pot/w.length;return{stake,pot,rs:sc.map(r=>({pid:r.pid,net:(w.includes(r.pid)?share:0)-stake}))}}
function scoresSection(g,w,dis){
  let h=`<section class="block"><h2 style="margin:0">Scores</h2>`;
  if(g.status==="planned"||!g.status)return h+`<div class="card"><p class="muted" style="margin:0 0 12px">Quand tout le monde est à table, lance la partie pour noter les scores.${n(g.buyIn)>0?` Le gagnant remporte le pot (${money(n(g.buyIn))} par joueur), partagé en cas d’égalité.`:""}</p>${w?`<button class="btn primary" data-act="start">Lancer la partie</button>`:""}</div></section>`;
  const sc=scoresOf(g),win=winners(g),filled=sc.filter(r=>r.score!=null).length;
  const order=[...sc].sort((a,b)=>a.score==null?1:b.score==null?-1:g.lowWins?a.score-b.score:b.score-a.score);
  h+=`<div class="list">${order.map(r=>`<div class="item">${avatar(r.pid)}<div class="grow" style="min-width:0"><div class="ellipsis" style="font-weight:600">${esc(pname(r.pid))}</div>${win.includes(r.pid)&&filled===sc.length?`<div style="font-size:12px;font-weight:700;color:var(--gold)">${win.length>1?"Ex æquo":"Vainqueur"}</div>`:""}</div>
    <input id="sc-${r.pid}" type="number" inputmode="decimal" step="any" data-score="${r.pid}" value="${r.score==null?"":r.score}" placeholder="Score" ${dis} style="width:96px;text-align:right;font-family:var(--f-mono)" aria-label="Score de ${esc(pname(r.pid))}"></div>`).join("")}</div>`;

  const bm=boardMoney(g);
  if(bm){h+=`<div class="row wrap" style="gap:8px"><div class="stat grow"><span class="eyebrow">Mise</span><b>${money(bm.stake)}</b></div><div class="stat grow"><span class="eyebrow">Pot</span><b>${money(bm.pot)}</b></div></div>`;
    if(bm.rs){const t=settle(bm.rs);h+=`<h2 style="margin:12px 0 0">Qui paie qui</h2>${t.length?`<div class="list">${t.map(x=>`<div class="transfer">${avatar(x.from)}<span class="ellipsis" style="font-weight:600">${esc(pname(x.from))}</span><span class="arrow">→</span>${avatar(x.to)}<span class="grow ellipsis" style="font-weight:600">${esc(pname(x.to))}</span><span class="num" style="font-weight:700">${money(x.v)}</span></div>`).join("")}</div>`:`<div class="card empty">Personne ne doit rien.</div>`}`}}
  if(filled===sc.length&&sc.length)h+=`<div class="row wrap"><button class="btn small" data-act="copy-results">Copier les résultats</button></div>`;
  if(w)h+=`<div class="row wrap">${g.status==="live"?`<button class="btn primary" data-act="finish" ${filled===sc.length&&sc.length?"":"disabled"}>Terminer la partie</button>${filled<sc.length?`<span class="muted" style="font-size:13px">Saisis le score de chacun pour terminer.</span>`:""}`:`<button class="btn small" data-act="reopen">Modifier les scores</button>`}</div>`;
  return h+`</section>`;
}

function frErr(e){console.warn("Supabase auth error:",e);const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return "Adresse mail ou mot de passe incorrect.";
  if(m.includes("not confirmed"))return "Confirme d’abord ton adresse mail avec le lien reçu.";
  if(m.includes("already registered")||m.includes("already been registered"))return "Un compte existe déjà avec cette adresse. Connecte-toi.";
  if(m.includes("rate limit")||m.includes("too many"))return "Trop d’essais. Attends quelques minutes puis réessaie.";
  if(m.includes("password"))return "Mot de passe trop faible : 8 caractères minimum.";
  if(m.includes("signups not allowed")||m.includes("signup is disabled"))return "Les inscriptions sont désactivées dans Supabase.";
  if(m.includes("invalid api key")||m.includes("apikey"))return "Clé Supabase refusée. Vérifie la clé publishable.";
  if(m.includes("failed to fetch")||m.includes("network"))return "Impossible de joindre Supabase. Vérifie ta connexion.";
  if(m.includes("email address")&&m.includes("invalid"))return "Supabase refuse cette adresse mail. Essaie une vraie adresse.";
  return "Erreur : "+((e&&e.message)||"inconnue")+" (envoie cette phrase à Claude)";}

const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function dieFace(n){return PIPS[n].map(p=>`<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>`).join("")}
function miniDice(){return `<span class="mdie">${dieFace(5)}</span><span class="mdie r">${dieFace(3)}</span>`}
function rollIcon(el){if(!el)return;const ds=el.querySelectorAll(".mdie");ds.forEach((d,k)=>{const v=1+Math.floor(Math.random()*6);
  d.classList.remove("rolling");void d.offsetWidth;d.classList.add("rolling");let t=0;
  const iv=setInterval(()=>{d.innerHTML=dieFace(1+Math.floor(Math.random()*6));if(++t>7){clearInterval(iv);d.innerHTML=dieFace(v)}},75)})}
function throwDice(src){
  if(throwDice.busy)return;throwDice.busy=true;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const layer=document.createElement("div");layer.className="dice-layer";layer.setAttribute("aria-hidden","true");
  const W=innerWidth,H=innerHeight;const r=src&&src.getBoundingClientRect?src.getBoundingClientRect():{left:W/2,top:H-120,width:0,height:0};
  const sx=r.left+r.width/2,sy=r.top+r.height/2;const faces=[];
  for(let k=0;k<2;k++){const d=document.createElement("div");d.className="die"+(k?" red":"");d.innerHTML=dieFace(1+Math.floor(Math.random()*6));layer.appendChild(d);faces.push(d)}
  document.body.appendChild(layer);
  const total=faces.map((d,k)=>{const v=1+Math.floor(Math.random()*6);
    const ex=W/2+(k?38:-38)+(Math.random()*30-15),ey=H*0.42+(Math.random()*30-15);
    const midx=(sx+ex)/2+(k?40:-40),midy=Math.min(sy,ey)-H*0.25;const rot=(k?1:-1)*(540+Math.random()*360);
    if(reduce){d.innerHTML=dieFace(v);d.animate([{transform:`translate(${ex-30}px,${ey-30}px)`,opacity:0},{transform:`translate(${ex-30}px,${ey-30}px)`,opacity:1}],{duration:250,fill:"forwards"});return v}
    let t=0;const iv=setInterval(()=>{d.innerHTML=dieFace(1+Math.floor(Math.random()*6));if(++t>9){clearInterval(iv);d.innerHTML=dieFace(v)}},75);
    d.animate([
      {transform:`translate(${sx-30}px,${sy-30}px) rotate(0deg) scale(.5)`,opacity:0},
      {transform:`translate(${midx-30}px,${midy-30}px) rotate(${rot*0.55}deg) scale(1.1)`,opacity:1,offset:.45},
      {transform:`translate(${ex-30}px,${ey-30}px) rotate(${rot*0.9}deg) scale(1)`,offset:.75},
      {transform:`translate(${ex-30+(k?10:-10)}px,${ey-44}px) rotate(${rot*0.97}deg) scale(1)`,offset:.87},
      {transform:`translate(${ex-30+(k?14:-14)}px,${ey-30}px) rotate(${Math.round(rot/90)*90}deg) scale(1)`,opacity:1}
    ],{duration:900+k*120,easing:"cubic-bezier(.25,.7,.3,1)",fill:"forwards"});return v});
  setTimeout(()=>{const s=document.createElement("div");s.className="dice-sum";s.textContent=total[0]+total[1];layer.appendChild(s)},reduce?250:1050);
  setTimeout(()=>{layer.classList.add("out");setTimeout(()=>{layer.remove();throwDice.busy=false},400)},reduce?900:1900);
}

  let h=`<section class="block" id="mini-timer"><div class="sec-title"><h2>Blindes</h2><span class="muted" style="font-size:13px">Niveau ${t.idx+1}/${t.levels.length}</span></div>

      <div class="mc-bl"><span class="eyebrow">Blindes</span><b class="num">${L[0].toLocaleString("fr-FR")} / ${L[1].toLocaleString("fr-FR")}</b><small>${nx?`Ensuite ${nx[0]} / ${nx[1]}`:"Dernier niveau"}</small></div></div>
    <div class="progress"><i id="t-bar" style="width:${Math.min(100,(1-remaining()/tot)*100)}%"></i></div>
    <div class="mc-ctrl"><button class="btn icon" data-act="t-prev" ${t.idx?"":"disabled"} aria-label="Niveau précédent">‹</button>
      <button class="btn primary" data-act="t-toggle" style="flex:1">${t.running?"Pause":"Démarrer"}</button>
      <button class="btn icon" data-act="t-next" ${nx?"":"disabled"} aria-label="Niveau suivant">›</button>
      <button class="btn icon" data-act="t-reset" aria-label="Remettre à zéro" style="font-size:16px">↺</button></div></div>
  <button class="btn small" data-act="t-struct" style="align-self:flex-start">${S.showLevels?"Masquer la structure":"Modifier la structure"}</button>`;
  if(S.showLevels)h+=`<div class="card" style="overflow-x:auto"><div class="levels">
    <span class="eyebrow">#</span><span class="eyebrow" style="text-align:right">Petite</span><span class="eyebrow" style="text-align:right">Grosse</span><span class="eyebrow" style="text-align:right">Min</span><span></span><span></span>
    ${t.levels.map((l,i)=>`<span class="num ${i===t.idx?"cur":"muted"}">${i+1}</span><input id="lv-${i}-0" type="number" data-lv="${i}" data-k="0" value="${l[0]}" inputmode="numeric"><input id="lv-${i}-1" type="number" data-lv="${i}" data-k="1" value="${l[1]}" inputmode="numeric"><input id="lv-${i}-2" type="number" data-lv="${i}" data-k="2" value="${l[2]}" inputmode="numeric"><span></span><button class="btn icon" data-act="lv-del" data-i="${i}" aria-label="Supprimer le niveau ${i+1}" style="width:30px;height:30px;min-height:30px;font-size:15px" ${t.levels.length>1?"":"disabled"}>×</button>`).join("")}
  </div><div style="margin-top:10px"><button class="btn small" data-act="lv-add">+ Ajouter un niveau</button></div></div>`;
  return h+`<p class="muted" style="font-size:12px;margin:0">Le timer tourne sur ton téléphone, avec un bip à chaque niveau.</p></section>`;
}
let actx=null,wake=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+0.22)})}catch(e){}}
function setLevel(i){const t=S.timer;t.idx=Math.max(0,Math.min(t.levels.length-1,i));t.remaining=t.levels[t.idx][2]*60;if(t.running)t.endAt=Date.now()+t.remaining*1000;saveTimer();render(true)}
setInterval(()=>{const cdd=document.getElementById("cd-m");if(cdd){const g=gamesSorted().up[0];const c=g&&countdown(g);if(c&&!c.over){document.getElementById("cd-d").textContent=c.d;document.getElementById("cd-h").textContent=String(c.h).padStart(2,"0");cdd.textContent=String(c.m).padStart(2,"0")}}
  const t=S.timer;if(!t.running)return;let r=remaining();
  if(r<=0){if(t.idx<t.levels.length-1){beep();t.idx++;t.endAt=Date.now()+t.levels[t.idx][2]*60*1000;saveTimer();render(true);return}
    t.running=false;t.remaining=0;beep();render(true);return}
  const c=document.getElementById("t-clock"),b=document.getElementById("t-bar");if(c)c.textContent=fmtT(r);if(b)b.style.width=Math.min(100,(1-r/(t.levels[t.idx][2]*60))*100)+"%"},250);

function render(force){

  if(!force&&a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){needsRender=true;return}
  needsRender=false;
  const y=window.scrollY;
  const noGroup=S.auth==="ok"&&!curGroup();const needJoin=S.auth!=="ok"||noGroup;
  document.querySelector("nav.tabs").hidden=needJoin;
  const layer=viewInviteLayer();if(layer)document.querySelector("nav.tabs").hidden=true;
  app.innerHTML=(S.auth!=="ok"?viewAuth():noGroup?viewHub():S.tab==="games"?(S.gameId?viewGame():viewGames()):S.tab==="board"?viewBoard():viewPlayers())+layer;

  if(el.dataset.score){const pid=el.dataset.score;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{score:el.value===""?null:n(el.value)})});return}
  if(el.dataset.g){const k=el.dataset.g;const v=k==="buyIn"?n(el.value):k==="lowWins"?el.checked:el.value;updGame(g=>{g[k]=v});return}
  if(el.dataset.out){const pid=el.dataset.out;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{out:el.value===""?null:n(el.value)})});return}
  if(el.dataset.pname){const nm=el.value.trim();if(!nm){render(true);return}write("players",el.dataset.pname,Object.assign({},S.data.players[el.dataset.pname],{name:nm}));return}
  if(el.dataset.meta){const G=curGroup();if(!G)return;write("groups",S.groupId,Object.assign({},G,{[el.dataset.meta]:el.value.trim()||G[el.dataset.meta]}));return}
  if(el.dataset.lv!=null){const i=+el.dataset.lv,k=+el.dataset.k;const v=Math.max(k===2?1:0,Math.round(n(el.value)));S.timer.levels[i][k]=v;
    if(i===S.timer.idx&&k===2&&!S.timer.running)S.timer.remaining=v*60;saveTimer();render(true);return}
});

/* ---------- boot ---------- */
render(true);
initAuth().catch(e=>{console.warn(e);S.auth="error";render(true)});
})();
</script>
