<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A78">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* ===== Finition « premium » ===== */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 50% 30%,transparent 55%,rgba(0,0,0,.55) 100%)}
#app{padding-block:18px 132px}
/* Cartes : même matière partout */
.card,.list,.stat,.qa,.kind,.stake,.notes,.wz-opt,.inv-sheet .inv{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 38%),var(--surface);
  border:1px solid rgba(237,229,211,.085);border-radius:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -26px rgba(0,0,0,.95)}
.list{border-radius:20px}
.stat{border-radius:16px}
.table-wrap,.ticket,.hub-card.create{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 50px -28px rgba(0,0,0,.95),0 0 0 1px rgba(210,172,103,.12)}
/* En-tête */
.brand{padding:4px 2px 0}
.brand .name{font-size:32px}
.grp-switch{margin-top:6px;padding:4px 10px!important;border-radius:999px;background:rgba(210,172,103,.08);border:1px solid rgba(210,172,103,.22);color:var(--gold-2)!important;font-weight:700}
.bell{border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));border-color:rgba(237,229,211,.12)}
/* Titres de section */
.sec-title h2,section.block>h2,section.block>.row>h2{display:flex;align-items:center;gap:8px}
.sec-title h2::before,section.block>h2::before,section.block>.row>h2::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));box-shadow:0 0 8px rgba(210,172,103,.6);flex:none}
.sec-title::after{background:linear-gradient(90deg,rgba(210,172,103,.55),rgba(210,172,103,0))}
/* Boutons */
.btn{border-radius:14px;font-weight:700;letter-spacing:.01em;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--surface-2);border:1px solid rgba(237,229,211,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.primary{background:linear-gradient(180deg,#F1D79E 0%,#D9B571 45%,#B78E4B 100%);color:#1B1307;border:1px solid #F2DCA6;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(120,80,20,.35),0 10px 24px -10px rgba(210,172,103,.7)}
.btn.danger{background:rgba(184,55,46,.08);border-color:rgba(224,119,108,.35)}
.btn.small{border-radius:12px}
/* Tuiles d'action */
.qa{min-height:118px;padding:16px 14px;gap:10px}
.qa .ic{width:44px;height:44px;border-radius:14px;font-size:20px}
.qa b{font-size:16px}
.qa small{font-size:12px}
.qa.p{background:linear-gradient(160deg,rgba(192,65,58,.16),transparent 55%),var(--surface)}
.qa.j{background:linear-gradient(160deg,rgba(46,91,138,.2),transparent 55%),var(--surface)}
.kind{padding:14px}
.kind .ic{width:38px;height:38px;border-radius:12px}
.kind b{font-size:14.5px}
/* Champs */
input,select,textarea{background:rgba(0,0,0,.28);border:1px solid rgba(237,229,211,.1);border-radius:14px;padding:11px 13px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(210,172,103,.18)}
label.field{letter-spacing:.12em}
/* Listes */
.item{padding:14px 16px}
.date-tile{border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.2));border:1px solid rgba(237,229,211,.1)}
.pill{border-radius:999px;padding:4px 10px}
.seg{border-radius:14px;padding:4px;background:rgba(0,0,0,.3);border-color:rgba(237,229,211,.1)}
.seg button{border-radius:10px;padding:7px 11px}
/* Barre de navigation flottante */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px;border:1px solid rgba(210,172,103,.22);background:rgba(16,20,24,.78);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 18px 40px -12px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06)}
nav.tabs .in{max-width:520px;gap:4px}
nav.tabs button{padding:8px 0;border-radius:18px;font-size:11px}
nav.tabs button.on{background:linear-gradient(180deg,rgba(210,172,103,.2),rgba(210,172,103,.06));color:var(--gold-2);box-shadow:inset 0 0 0 1px rgba(210,172,103,.3)}
nav.tabs button.on::before{display:none}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:14px}
.live-bar{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
/* Profil */
.me-card{background:radial-gradient(120% 120% at 0% 0%,rgba(91,26,42,.75),transparent 60%),var(--surface)}
</style>
<title>Kicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
<style>
/* Kicker — salon privé : nuit profonde, feutre émeraude, velours bordeaux, laiton */
:root{
  color-scheme:dark;
  --bg:#0A0D0F; --bg-2:#10151A;
  --surface:#141A1F; --surface-2:#1C242A; --surface-3:#243037;
  --ink:#EDE5D3; --muted:#8F968F; --line:#28323A; --line-soft:rgba(237,229,211,.07);
  --felt:#0E4A37; --felt-2:#0A3527; --felt-ink:#EDE5D3;
  --velvet:#5B1A2A; --velvet-2:#3A1019;
  --gold:#D2AC67; --gold-2:#F0D69C; --gold-deep:#8A6A32;
  --chip:#C0413A; --sapphire:#2E5B8A;
  --win:#5FC593; --loss:#E0776C; --warn:#E4AE52;
  --glow-gold:0 0 0 1px rgba(210,172,103,.35),0 8px 30px -8px rgba(210,172,103,.35);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.7);
  --f-display:"Noto Serif Display","DejaVu Serif Condensed",Georgia,serif; --title:#FFFFFF; --f-body:"Manrope",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:
  radial-gradient(120% 60% at 100% -10%,rgba(91,26,42,.45),transparent 60%),
  radial-gradient(90% 50% at -10% 30%,rgba(14,74,55,.35),transparent 60%),
  radial-gradient(80% 40% at 50% 110%,rgba(46,91,138,.18),transparent 70%),
  var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:linear-gradient(45deg,var(--line-soft) 25%,transparent 25%,transparent 75%,var(--line-soft) 75%),linear-gradient(45deg,var(--line-soft) 25%,transparent 25%,transparent 75%,var(--line-soft) 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;mask-image:linear-gradient(to bottom,#000,transparent 70%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%)}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;font-stretch:72%;text-wrap:balance;margin:0;letter-spacing:0}
h1{font-size:30px;color:var(--title);text-shadow:0 2px 0 rgba(0,0,0,.45)}
h2{font-size:18px;margin-bottom:10px;color:var(--title)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .win{color:var(--win)} .loss{color:var(--loss)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
section.block{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.sec-title{display:flex;align-items:center;gap:10px;margin:0}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-deep),transparent)}
.sec-title h2{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;font-weight:700;background:var(--surface-3);border:1px solid var(--line);min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--gold-deep)}
.btn.primary{background:linear-gradient(180deg,#E7C888,var(--gold) 50%,#B38D4C);color:#1E1608;border-color:#E9CF94;box-shadow:0 6px 20px -8px rgba(210,172,103,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.danger{background:transparent;color:var(--loss);border:1px solid rgba(224,119,108,.35)}
.btn.small{padding:6px 11px;min-height:34px;font-size:13px}
.btn.icon{width:38px;height:38px;min-height:38px;padding:0;font-size:20px;border-radius:50%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#5E665F}
input[type=checkbox]{accent-color:var(--gold)}
textarea{min-height:64px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.collapse{grid-template-columns:1fr}}
.banner{font-size:13px;padding:9px 12px;border-radius:12px;background:rgba(210,172,103,.08);border:1px solid rgba(210,172,103,.22);color:var(--gold-2);margin-bottom:14px}

/* ===== Accueil ===== */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand .mark{display:flex;align-items:center;gap:12px;min-width:0}
.chipstack{position:relative;width:44px;height:44px;flex:none}
.chipstack i{position:absolute;left:0;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0 38%,#EDE5D3 39% 41%,var(--c) 42% 60%,transparent 61%),repeating-conic-gradient(var(--c) 0 22.5deg,#EDE5D3 22.5deg 45deg);
  box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.25)}
.chipstack i:nth-child(1){--c:var(--velvet);top:6px;left:6px;transform:scale(.8)}
.chipstack i:nth-child(2){--c:var(--felt);top:0;left:-2px;transform:scale(.86) rotate(12deg)}
.chipstack i:nth-child(3){--c:var(--chip);top:-5px;left:3px;transform:scale(.9) rotate(-8deg)}
.brand .name{font-family:var(--f-display);font-weight:900;font-stretch:68%;font-size:30px;letter-spacing:.01em;line-height:1;color:var(--title);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.brand .grp{font-size:12px;color:var(--muted);margin-top:3px}
.suits{font-family:var(--f-display);letter-spacing:.35em;color:var(--gold-deep);font-size:12px}

/* Table ovale */
.table-wrap{position:relative;padding:34px 22px 40px;border-radius:26px;background:linear-gradient(180deg,var(--velvet),var(--velvet-2));border:1px solid rgba(210,172,103,.25);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.table-wrap::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px);pointer-events:none}
.marquee{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;pointer-events:none}
.marquee.bot{top:auto;bottom:10px}
.marquee b{width:5px;height:5px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 6px 1px rgba(240,214,156,.7);opacity:.35}
@media (prefers-reduced-motion:no-preference){.marquee b{animation:bulb 2.4s infinite}.marquee b:nth-child(odd){animation-delay:1.2s}}
@keyframes bulb{0%,100%{opacity:.25}50%{opacity:1}}
.oval{position:relative;aspect-ratio:1.55/1;max-width:100%;border-radius:50%/50%;
  background:radial-gradient(ellipse at 50% 40%,#17684D 0%,var(--felt) 45%,var(--felt-2) 100%);
  box-shadow:0 0 0 8px #2A1A10,0 0 0 10px var(--gold-deep),0 0 0 12px #1A0F09,0 18px 40px -10px rgba(0,0,0,.8),inset 0 0 40px rgba(0,0,0,.5)}
.oval::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(240,214,156,.18)}
.oval .center{position:absolute;inset:18% 16%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;cursor:pointer;border-radius:50%;color:var(--felt-ink)}
.oval .center .eyebrow{color:rgba(237,229,211,.65);font-size:9.5px}
.oval .center .t{font-family:var(--f-display);font-stretch:72%;font-weight:800;color:var(--title);font-size:clamp(15px,4.4vw,21px);line-height:1.15;text-wrap:balance}
.oval .center .d{font-size:12px;opacity:.8}
.count{display:flex;gap:6px;margin-top:6px}
.count span{background:rgba(0,0,0,.35);border:1px solid rgba(240,214,156,.25);border-radius:8px;padding:3px 7px;min-width:40px}
.count b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--gold-2);line-height:1.1}
.count small{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:0;cursor:pointer;z-index:1;-webkit-tap-highlight-color:transparent}
.seat.hop{z-index:3}
.seat.sel{z-index:4}
.seat.sel .avatar{box-shadow:0 0 0 2px #0A0D0F,0 0 0 4px var(--gold-2),0 0 20px rgba(240,214,156,.9)!important;filter:none!important;opacity:1!important}
.seat.sel em{color:var(--gold-2)}
@media (prefers-reduced-motion:no-preference){.seat.sel .avatar{animation:seatPulse 1s ease-in-out infinite}}
@keyframes seatPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:no-preference){
  .seat{transition:left .55s cubic-bezier(.34,1.3,.5,1),top .55s cubic-bezier(.34,1.3,.5,1)}
  .seat.hop .avatar{animation:seatHop .55s ease}
  .seat.slide .avatar{animation:seatSlide .55s ease}
  .seat:active .avatar{transform:scale(.92)}}
@keyframes seatHop{0%{transform:scale(1)}40%{transform:scale(1.28) translateY(-6px);box-shadow:0 0 0 2px #0A0D0F,0 0 0 3.5px var(--gold),0 0 22px rgba(240,214,156,.8)}100%{transform:scale(1)}}
@keyframes seatSlide{0%{transform:scale(1)}50%{transform:scale(.82);opacity:.7}100%{transform:scale(1)}}
.seat .avatar{width:34px;height:34px;box-shadow:0 0 0 2px #0A0D0F,0 0 0 3.5px var(--ring,transparent)}
.seat.yes{--ring:var(--gold)}
.seat.yes .avatar{box-shadow:0 0 0 2px #0A0D0F,0 0 0 3.5px var(--gold),0 0 14px rgba(210,172,103,.55)}
.seat.maybe .avatar{opacity:.8;box-shadow:0 0 0 2px #0A0D0F,0 0 0 3px transparent;outline:1.5px dashed var(--gold);outline-offset:1px}
.seat.no .avatar,.seat.none .avatar,.seat.invited .avatar{filter:grayscale(1);opacity:.35}
.seat em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
.table-meta{display:flex;justify-content:space-between;gap:10px;margin-top:22px;position:relative;flex-wrap:wrap}
.table-meta .chip{background:rgba(0,0,0,.3);border:1px solid rgba(240,214,156,.2);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.my-rsvp{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.empty-table{position:relative;text-align:center;padding:10px 0 4px}

/* Actions rapides */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qa{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 12px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-3),var(--surface));text-align:left;min-height:96px}
.qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-weight:800}
.qa b{font-size:13px;line-height:1.2}
.qa small{font-size:11px;color:var(--muted)}
.qa.p .ic{background:rgba(192,65,58,.18);color:#F08C84;border:1px solid rgba(192,65,58,.4)}
.qa.j .ic{background:rgba(46,91,138,.2);color:#8DB6E3;border:1px solid rgba(46,91,138,.45)}
.qa.t .ic{background:rgba(210,172,103,.14);color:var(--gold-2);border:1px solid rgba(210,172,103,.35)}
.qa:hover{border-color:var(--gold-deep)}
@media (max-width:380px){.qa small{display:none}}

/* Jackpot / stats */
.jackpot{position:relative;border-radius:18px;padding:16px;background:linear-gradient(180deg,#171109,#0E0B07);border:1px solid rgba(210,172,103,.35);box-shadow:var(--glow-gold);text-align:center;overflow:hidden}
.jackpot::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 50% 0%,rgba(240,214,156,.16),transparent 70%)}
.jackpot .v{position:relative;font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em;color:var(--gold-2);text-shadow:0 0 18px rgba(240,214,156,.35)}
.jackpot .eyebrow{position:relative;color:var(--gold)}
.jackpot .sub{position:relative;font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;margin-top:3px;color:var(--ink)}
@media (max-width:420px){.stat b{font-size:15px}}

/* Champions */
.champs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.champ{position:relative;border-radius:16px;padding:14px;border:1px solid var(--line);overflow:hidden;min-width:0;text-align:left;width:100%}
.champ.poker{background:linear-gradient(150deg,rgba(192,65,58,.22),var(--surface) 60%)}
.champ.jeux{background:linear-gradient(150deg,rgba(46,91,138,.28),var(--surface) 60%)}
.champ .suit{position:absolute;right:-6px;top:-18px;font-family:var(--f-display);font-size:86px;line-height:1;opacity:.1;pointer-events:none}
.champ .who{display:flex;align-items:center;gap:10px;margin-top:10px}
.champ .avatar{width:40px;height:40px;font-size:15px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
.champ .nm{font-weight:800;font-size:15px}
.champ .sc{font-family:var(--f-mono);font-size:13px}
@media (max-width:350px){.champs{grid-template-columns:1fr}}

/* Listes */
.list{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.item:first-child{border-top:0}
button.item:hover{background:rgba(210,172,103,.05)}
.date-tile{width:48px;flex:none;text-align:center;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);padding:5px 0;line-height:1.1}
.date-tile b{display:block;font-family:var(--f-display);font-size:18px;color:var(--gold-2)}
.date-tile span{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.date-tile.k-board{border-color:rgba(46,91,138,.5)}
.date-tile.k-poker{border-color:rgba(192,65,58,.45)}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.live{background:var(--chip);color:#fff;border-color:transparent;box-shadow:0 0 12px rgba(192,65,58,.6)}
.pill.planned{background:rgba(95,197,147,.1);color:var(--win);border-color:rgba(95,197,147,.3)}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:var(--f-display);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.12)}

/* RSVP */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on[data-v="yes"]{background:linear-gradient(180deg,#E7C888,var(--gold));color:#1E1608}
.seg button.on[data-v="maybe"]{background:var(--surface-3);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.seg button.on[data-v="no"]{background:rgba(224,119,108,.18);color:var(--loss)}

/* Caisse */
.cash{display:grid;grid-template-columns:minmax(0,1fr) auto 92px;gap:8px 10px;align-items:center}
.cash .hd{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .val{min-width:58px;text-align:center;font-weight:700;color:var(--gold-2)}
.cash input{text-align:right;font-family:var(--f-mono);padding:8px}
.net{font-size:12px}
@media (max-width:480px){.cash{grid-template-columns:1fr 96px}.cash .who{grid-column:1/-1;margin-top:6px}.cash .hd.h-who{display:none}.cash .hd.h-mis{text-align:left!important}.stepper .btn.icon{width:34px;height:34px;min-height:34px}}
.check{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--surface-2);flex-wrap:wrap}
.check.bad{background:rgba(228,174,82,.12);color:var(--warn);border:1px solid rgba(228,174,82,.3)}
.check.ok{background:rgba(95,197,147,.1);color:var(--win);border:1px solid rgba(95,197,147,.3)}
.transfer{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.transfer:first-child{border-top:0}
.arrow{color:var(--gold)}

/* Classement */
.rank{width:26px;text-align:center;font-family:var(--f-display);font-weight:800;color:var(--muted);flex:none}
.rank.r1{color:var(--gold-2);text-shadow:0 0 10px rgba(240,214,156,.5)}
.bar{height:6px;border-radius:3px;background:var(--bg-2);position:relative;margin-top:6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}

/* Timer */
.clock{position:relative;background:radial-gradient(ellipse at 50% 30%,#17684D,var(--felt) 50%,var(--felt-2));color:var(--felt-ink);border-radius:24px;padding:24px 18px;text-align:center;border:1px solid rgba(210,172,103,.3);box-shadow:var(--shadow),inset 0 0 40px rgba(0,0,0,.45)}
.clock .time{font-family:var(--f-mono);font-weight:700;font-size:clamp(56px,18vw,96px);line-height:1;letter-spacing:-.02em;color:var(--gold-2);text-shadow:0 0 24px rgba(240,214,156,.3)}
.clock .blinds{font-family:var(--f-display);font-size:clamp(24px,7vw,34px);margin-top:10px}
.clock .eyebrow{color:rgba(237,229,211,.65)}
.progress{height:6px;background:rgba(0,0,0,.35);border-radius:3px;margin-top:18px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-2));width:0}
.levels{display:grid;grid-template-columns:28px 1fr 1fr 1fr 64px 34px;gap:6px;align-items:center}
.levels input{padding:7px;text-align:right;font-family:var(--f-mono);font-size:13px}
.levels .cur{color:var(--gold-2);font-weight:700}

/* Fiche soirée */
.ticket{position:relative;overflow:hidden;border-radius:22px;padding:30px 18px 20px;background:linear-gradient(170deg,var(--velvet),var(--velvet-2));border:1px solid rgba(210,172,103,.3);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
.ticket::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px);pointer-events:none}
.ticket>*{position:relative}
.ticket .marquee{position:absolute}
.ticket-kind{color:var(--gold-2)}
.ticket-title{font-family:var(--f-display);font-weight:800;font-stretch:72%;font-size:32px;line-height:1.1;color:var(--title);background:transparent;border:0;border-bottom:1px dashed rgba(240,214,156,.3);border-radius:0;padding:4px 0 8px;margin-top:4px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.ticket-title:focus{outline:none;border-bottom-color:var(--gold)}
.ticket-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:16px}
.tf{min-width:0;display:flex;flex-direction:column;gap:5px;background:rgba(0,0,0,.28);border:1px solid rgba(240,214,156,.18);border-radius:14px;padding:9px 12px}
.tf.full{grid-column:1/-1}
.tf span{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,229,211,.6)}
.tf input{width:100%;min-width:0;-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;font-weight:700;font-size:16px;color:var(--ink);border-radius:0}
.tf input:focus{outline:none}
.tf:focus-within{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tf input::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(.4)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kind{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-3),var(--surface));text-align:left;min-width:0}
.kind .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.kind b{font-size:13px;line-height:1.15}.kind small{font-size:11px;color:var(--muted)}
.kind.p .ic{background:rgba(192,65,58,.18);color:#F08C84;border:1px solid rgba(192,65,58,.4)}
.kind.t .ic{background:rgba(31,107,82,.25);color:#7FD3AA;border:1px solid rgba(31,107,82,.5)}
.kind.j .ic{background:rgba(46,91,138,.2);color:#8DB6E3;border:1px solid rgba(46,91,138,.45)}
.kind.on{border-color:var(--gold);box-shadow:var(--glow-gold);background:linear-gradient(160deg,rgba(210,172,103,.14),var(--surface) 70%)}
.kind[disabled]{cursor:default}
.stake .stake-v{font-size:20px;font-weight:700;color:var(--gold-2)}
.pchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.pchip{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,var(--c) 0 52%,transparent 53%),repeating-conic-gradient(var(--c) 0 30deg,#EDE5D3 30deg 60deg);
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.25)}
.pchip span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed rgba(237,229,211,.55);font-family:var(--f-mono);font-weight:700;font-size:12px;color:#fff}
.pchip.on{box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 0 3px var(--bg),0 0 0 5px var(--gold),0 0 18px rgba(210,172,103,.6);transform:translateY(-3px)}
.pcustom{display:flex;flex-direction:column;gap:3px;flex:1;min-width:84px}
.pcustom input{font-family:var(--f-mono);text-align:right}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:600;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.rb-switch{color:#14213D;gap:8px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.rb-switch .rb-l{order:0;flex:1;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.rb-switch .rb-no{order:1}.rb-switch i{order:2}.rb-switch .rb-yes{order:3}
.rb-opt{font-size:12px;font-weight:700;color:var(--muted);min-width:24px;text-align:center;padding:2px 6px;border-radius:8px;transition:color .15s,background .15s}
.rb-opt.on{color:#fff;background:var(--green,#1E9E5A)}
.switch i::after{will-change:transform}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:44px;height:26px;border-radius:13px;background:var(--surface-3);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked+i{background:rgba(210,172,103,.25);border-color:var(--gold)}
.switch input:checked+i::after{transform:translateX(18px);background:var(--gold-2)}
.switch input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.notes{min-height:84px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border-radius:16px;padding:12px 14px}
@media (max-width:380px){.kind small{display:none}.pchip{width:44px;height:44px}}
/* Groupes */
.hub-q{font-size:28px;margin:4px 0 6px;color:var(--title)}
.hub-sub{color:rgba(237,229,211,.7);font-size:13.5px;margin:0 0 14px}
.hub-quick{grid-template-columns:1fr 1fr}
.hub-quick .qa{min-height:120px}
.hub-quick .qa b{font-size:15px}
.code-input{font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:14px 8px;background:rgba(0,0,0,.3);border:1px solid rgba(240,214,156,.3);color:var(--gold-2)}
.code-show{font-family:var(--f-mono);font-size:32px;font-weight:700;letter-spacing:.3em;color:var(--gold-2);margin-top:4px}
.grp-ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--title);background:linear-gradient(160deg,var(--velvet),var(--velvet-2));border:1px solid rgba(210,172,103,.3)}
.grp-switch{display:inline-flex;gap:4px;align-items:center;padding:2px 0;color:var(--muted);font-size:12px;max-width:100%}
.grp-switch:hover{color:var(--gold-2)}
.tf-select{background:transparent;border:0;padding:0;font-weight:700;font-size:16px;color:var(--ink)}
/* Hub (accueil groupes) */
.hub-hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:5vh 0 10px}
.hub-glow{position:absolute;top:0;left:50%;width:320px;height:240px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(210,172,103,.22),transparent);pointer-events:none}
.hub-hero .chipstack.big{transform:scale(1.9);margin:22px 0 30px}
.hub-name{position:relative;font-family:var(--f-display);font-weight:900;font-stretch:68%;font-size:clamp(42px,13vw,60px);line-height:.95;letter-spacing:.01em;color:var(--title);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.hub-tag{position:relative;margin-top:8px;font-size:13.5px;color:var(--muted)}
.hub-suits{position:relative;margin-top:12px;font-size:15px;letter-spacing:.6em;color:var(--gold)}
.hub-hello{position:relative;margin-top:16px;font-size:14px;color:var(--ink);padding:6px 14px;border-radius:999px;background:rgba(210,172,103,.08);border:1px solid rgba(210,172,103,.22)}
.hub-hello b{color:var(--gold-2)}
.hub-actions{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.hub-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;min-height:118px;padding:22px 20px;border-radius:22px;text-align:left;border:1px solid var(--line);box-shadow:var(--shadow)}
.hub-card.create{background:linear-gradient(135deg,var(--velvet) 0%,var(--velvet-2) 60%,var(--surface) 100%);border-color:rgba(210,172,103,.35)}
.hub-card.rejoin{background:linear-gradient(135deg,#123A2D 0%,var(--felt-2) 55%,var(--surface) 100%);border-color:rgba(95,197,147,.3)}
.hub-card .hub-suit{position:absolute;right:-10px;bottom:-34px;font-size:150px;line-height:1;opacity:.08;pointer-events:none;font-family:var(--f-display)}
.hub-card .ic{position:relative;width:58px;height:58px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:30px;background:rgba(0,0,0,.28);border:1px solid rgba(240,214,156,.25)}
.hub-card.create .ic{color:#F08C84}.hub-card.rejoin .ic{color:#7FD3AA}
.hub-card .txt{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.hub-card b{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:25px;line-height:1.05;color:var(--title)}
.hub-card small{font-size:13px;color:rgba(237,229,211,.72);line-height:1.35}
.hub-card .go,.hub-item .go{position:relative;font-size:28px;color:var(--gold);flex:none}
.hub-card:hover{border-color:var(--gold);box-shadow:var(--glow-gold)}
@media (prefers-reduced-motion:no-preference){.hub-card{transition:transform .12s,box-shadow .15s,border-color .15s}.hub-card:active{transform:scale(.985)}}
.hub-groups{margin-top:30px}
.hub-count{font-family:var(--f-mono);font-size:12px;color:var(--gold-2);padding:2px 8px;border-radius:999px;border:1px solid rgba(210,172,103,.3)}
.hub-item{padding:16px}
.hub-item .grp-ic{width:48px;height:48px;border-radius:14px;font-size:22px}
.hub-item .ellipsis{font-size:16px}
.hub-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 18px}
.hub-empty b{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:20px;color:var(--title)}
.hub-empty span{color:var(--muted);font-size:13.5px}
.hub-empty-cards{display:flex;gap:0;margin-bottom:8px}
.hub-empty-cards i{font-style:normal;width:40px;height:56px;border-radius:7px;background:linear-gradient(160deg,#FFFDF7,#E9E1CF);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px -4px rgba(0,0,0,.6)}
.hub-empty-cards i:first-child{color:#16181C;transform:rotate(-10deg) translateX(6px)}
.hub-empty-cards i:last-child{color:#B3202A;transform:rotate(8deg) translateX(-6px)}
.quick.two{grid-template-columns:1fr 1fr}
.kinds.two{grid-template-columns:1fr 1fr}
/* Boutons & finitions */
button,.btn,a,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rip-wrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);transform:scale(0);pointer-events:none;animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .btn,.qa,.kind,.pchip,.hub-card,.live-btn,.wz-bl,.seg button,nav.tabs button,.bell,.row-del,.item{transition:transform .14s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,background .2s,border-color .2s,filter .2s}
  .btn:active,.qa:active,.kind:active,.hub-card:active,.live-btn:active,.wz-bl:active,.seg button:active,.bell:active,.row-del:active{transform:scale(.95)}
  .pchip:active{transform:scale(.9) translateY(1px)}
  .pchip.on{animation:chipPick .35s cubic-bezier(.3,1.6,.5,1)}
  .kind.on{animation:kindPick .35s cubic-bezier(.3,1.6,.5,1)}
  .seg button.on{animation:segPick .25s ease}
  nav.tabs button.on svg{animation:navPop .35s cubic-bezier(.3,1.6,.5,1)}
  .btn.primary{background-size:200% 100%;position:relative;overflow:hidden}
  .btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
  @media (hover:hover){.btn:hover,.qa:hover,.kind:hover,.hub-card:hover,.live-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(0,0,0,.7)}.btn.primary:hover{filter:brightness(1.06)}}
}
@keyframes chipPick{0%{transform:translateY(0) scale(.85)}60%{transform:translateY(-6px) scale(1.08)}100%{transform:translateY(-3px) scale(1)}}
@keyframes kindPick{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes segPick{from{transform:scale(.85);opacity:.6}}
@keyframes navPop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shine{0%,70%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.savebadge{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;font-size:12px;font-weight:700;padding:6px 12px 6px 26px;border-radius:999px;background:rgba(20,26,31,.92);border:1px solid var(--line);color:var(--muted);box-shadow:0 8px 20px -8px rgba(0,0,0,.7)}
.savebadge::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--muted)}
.savebadge.saving::before{background:var(--gold);animation:blinkP 1s steps(2) infinite}
.savebadge.saved{color:var(--win)}.savebadge.saved::before{background:var(--win)}
.savebadge.error{color:var(--loss)}.savebadge.error::before{background:var(--loss)}
/* Animations v2 */
@media (prefers-reduced-motion:no-preference){
  #app.view-left>*:not(.inv-layer){animation:viewLeft .34s cubic-bezier(.2,.8,.3,1) both}
  #app.view-right>*:not(.inv-layer){animation:viewRight .34s cubic-bezier(.2,.8,.3,1) both}
  .stag{animation:stagIn .45s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0) * 45ms + 80ms)}
  .pchip.stag{animation-name:chipRoll}
  .sec-title::after{transform-origin:left;animation:lineDraw .7s .15s cubic-bezier(.2,.8,.3,1) both}
  .toast.in{animation:toastIn .38s cubic-bezier(.2,1.4,.4,1) both}
  .toast.out{animation:toastOut .26s ease forwards}
  .inv-layer{animation:fadeIn .25s ease both}
  .inv-pop,.inv-sheet{animation:invIn .45s cubic-bezier(.2,1.25,.4,1) both}
  .seat.pulse .avatar{animation:seatPulse .6s ease}
  .oval{position:relative}
  .oval::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);background-size:250% 100%;animation:feltSheen 7s ease-in-out infinite;pointer-events:none}
  .bell b{animation:bellBadge 2.4s ease-in-out infinite}
  .pill.live{animation:livePulse 1.8s ease-in-out infinite}
  .count b{display:inline-block}
  .hub-card .ic,.qa .ic{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .hub-card:active .ic,.qa:active .ic{transform:rotate(-12deg) scale(1.12)}
  .avatar{transition:transform .2s}
  .item:active .avatar{transform:scale(.9)}
}
@keyframes viewLeft{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes viewRight{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes stagIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes chipRoll{from{opacity:0;transform:translateX(-40px) rotate(-200deg)}to{opacity:1;transform:none}}
@keyframes lineDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,12px) scale(.96)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes seatPulse{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes feltSheen{0%,100%{background-position:120% 0}50%{background-position:-20% 0}}
@keyframes bellBadge{0%,80%,100%{transform:scale(1)}88%{transform:scale(1.25)}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(192,65,58,.6)}50%{box-shadow:0 0 0 6px rgba(192,65,58,0)}}
/* Effets */
@media (prefers-reduced-motion:no-preference){
  #app.view-in>*:not(.inv-layer){animation:viewIn .32s ease both}
  #app.view-up>*:not(.inv-layer){animation:viewUp .42s cubic-bezier(.2,.9,.3,1) both}
  .seat.deal{animation:deal .55s cubic-bezier(.2,1.3,.4,1) both}
  .pot-bump{animation:potBump .35s ease}
  .bar i{animation:barGrow .8s cubic-bezier(.2,.8,.3,1) both}
  .cel-crown{animation:crown 1s cubic-bezier(.2,1.5,.4,1) both}
  .cel-win .avatar{animation:winPop .6s .15s cubic-bezier(.2,1.5,.4,1) both}
  .btn.primary:active,.qa:active,.hub-card:active{transform:scale(.97)}
}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes viewUp{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
@keyframes deal{from{opacity:0;left:50%;top:50%;transform:translate(-50%,-50%) scale(.3) rotate(-90deg)}}
@keyframes potBump{40%{transform:scale(1.18);color:var(--gold-2)}}
@keyframes barGrow{from{width:0}}
@keyframes crown{from{transform:translateY(-30px) scale(.4) rotate(-20deg);opacity:0}}
@keyframes winPop{from{transform:scale(.3);opacity:0}}
.fly-chip{position:fixed;left:0;top:0;width:28px;height:28px;border-radius:50%;z-index:60;pointer-events:none;
  background:radial-gradient(circle,var(--c) 0 42%,#EDE5D3 43% 47%,var(--c) 48% 62%,transparent 63%),repeating-conic-gradient(var(--c) 0 30deg,#EDE5D3 30deg 60deg);box-shadow:0 6px 12px rgba(0,0,0,.5)}
.cel-layer{align-items:center}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.cel-pop{text-align:center;position:relative}
.cel-crown{font-size:44px;color:var(--gold-2);line-height:1;margin:6px 0 4px;text-shadow:0 0 20px rgba(240,214,156,.6)}
.cel-win{display:flex;flex-direction:column;align-items:center;gap:6px}
.cel-win .avatar{width:64px;height:64px;font-size:26px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold),0 0 30px rgba(210,172,103,.6)}
.cel-name{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:30px;color:var(--title)}
.cel-sub{font-size:18px;font-weight:700}
.cel-dur{font-size:12.5px;color:var(--muted);margin-top:6px}
.cel-list{margin-top:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.cel-line{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14px}
.cel-line b{color:var(--gold-2)}
/* Afficher le mot de passe */
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:48px!important;width:100%}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#7C89A6;background:transparent}
.pw-eye svg{width:21px;height:21px}
.pw-eye .slash{opacity:0;transition:opacity .2s}
.pw-eye.on{color:#1652D9}
.pw-eye.on .slash{opacity:1}
.pw-eye:active{transform:translateY(-50%) scale(.9)}
/* Face ID */
.lock-box{text-align:center;display:flex;flex-direction:column;align-items:center}
.lock-ic{width:84px;height:84px;margin:4px auto 10px;color:#1652D9;display:grid;place-items:center;border-radius:24px;background:radial-gradient(circle,rgba(22,82,217,.12),transparent 70%)}
.lock-ic svg{width:64px;height:64px}
@media (prefers-reduced-motion:no-preference){.lock-ic svg{animation:faceScan 2.2s ease-in-out infinite}}
@keyframes faceScan{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(22,82,217,0))}50%{transform:scale(1.06);filter:drop-shadow(0 0 10px rgba(22,82,217,.55))}}
.fid-pop .lock-ic{color:#1652D9}
.fid-toggle{display:inline-flex;align-items:center;gap:7px;margin-top:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.fid-dot{width:9px;height:9px;border-radius:50%;background:#9AA6BD}
.fid-toggle.on .fid-dot{background:#2DBA55;box-shadow:0 0 8px #2DBA55}
/* Partie en cours */
.live-head{text-align:center;margin:4px 0 16px}
.live-title{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:32px;line-height:1.05;color:var(--title);margin-top:4px}
.live-clock{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.live-clock span{font-family:var(--f-mono);font-weight:700;font-size:clamp(38px,12vw,54px);line-height:1;color:var(--gold-2);text-shadow:0 0 18px rgba(240,214,156,.3)}
.live-clock small{color:var(--muted);font-size:12.5px;margin-top:6px}
.live-clock.paused span{color:var(--muted);text-shadow:none}
@media (prefers-reduced-motion:no-preference){.live-clock.paused span{animation:blinkP 1.2s steps(2) infinite}}
@keyframes blinkP{50%{opacity:.35}}
.pause-pill{background:rgba(228,174,82,.15);color:var(--warn);border-color:rgba(228,174,82,.35)}
.live-table.is-paused .oval{filter:saturate(.55) brightness(.8)}
.stack-tag{font-size:9.5px;font-weight:700;color:#1E1608;background:linear-gradient(180deg,#E7C888,var(--gold));padding:1px 5px;border-radius:6px;white-space:nowrap}
.pause-badge{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--warn);text-transform:uppercase}
.oval .center .t.num{font-family:var(--f-mono)}
.live-bar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(10,13,15,.92) 30%)}
.live-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:18px;font-weight:700;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);box-shadow:0 10px 24px -10px rgba(0,0,0,.8)}
.live-btn svg{width:24px;height:24px}
.live-btn.pause{border-color:rgba(228,174,82,.4);color:var(--warn)}
.live-btn.resume{background:linear-gradient(180deg,#E7C888,var(--gold));color:#1E1608;border-color:#E9CF94}
.live-btn.stop{background:rgba(184,55,46,.18);border-color:rgba(224,119,108,.45);color:var(--loss)}
@media (prefers-reduced-motion:no-preference){.live-btn{transition:transform .1s}.live-btn:active{transform:scale(.96)}}
.back-live{width:100%;margin-bottom:14px}
/* Suppression */
.row-wrap{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row-wrap:first-child{border-top:0}
.row-wrap .item{border-top:0;flex:1;min-width:0}
.row-del{flex:none;width:46px;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line)}
.row-del svg{width:19px;height:19px}
.row-del:hover{color:var(--loss);background:rgba(224,119,108,.08)}
.inv-pop.del-pop{background:linear-gradient(170deg,#3A1418,var(--surface) 60%);border-color:rgba(224,119,108,.4)}
.inv-badge.del-badge{background:var(--loss);color:#fff}
.del-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn.danger-solid{background:#B8372E;color:#fff;border-color:#D0564C}
.btn.danger-solid:hover{background:#C9443A}
.btn.danger svg{width:18px;height:18px}
/* Invitations */
.bell{position:relative;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.bell svg{width:22px;height:22px}
.bell b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--chip);color:#fff;font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.hub-bell{position:absolute;top:0;right:0}
.inv-layer{position:fixed;inset:0;z-index:30;background:rgba(5,7,8,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:560px){.inv-layer{align-items:center}}
.inv-pop,.inv-sheet{width:100%;max-width:440px;border-radius:24px;padding:20px;background:linear-gradient(170deg,var(--velvet),var(--velvet-2) 55%,var(--surface));border:1px solid rgba(210,172,103,.35);box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.inv-sheet{max-height:80vh;overflow:auto;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.inv-pop{animation:invIn .45s cubic-bezier(.2,1.2,.4,1)}}
@keyframes invIn{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.inv-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1E1608;background:linear-gradient(180deg,#E7C888,var(--gold));padding:4px 10px;border-radius:999px;margin-bottom:12px}
.inv{display:flex;flex-direction:column;gap:8px}
.inv-sheet .inv{padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.inv .eyebrow{color:var(--gold-2)}
.inv-title{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:24px;line-height:1.1;color:var(--title)}
.inv.big .inv-title{font-size:30px}
.inv-meta{font-size:13.5px;color:rgba(237,229,211,.75)}
.inv-host{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:4px}
.inv-actions{display:grid;grid-template-columns:1.2fr 1.1fr .9fr;gap:8px;margin-top:8px}
.inv-actions .btn{padding:10px 4px;font-size:14px;white-space:nowrap}
.inv-later{display:block;margin:12px auto 0;background:transparent;border-color:transparent;color:var(--muted)}
/* Mini dés (icône jeux de société) */
.dice-ic{position:relative;display:flex!important;align-items:center;justify-content:center;gap:1px;overflow:visible}
.mdie{width:14px;height:14px;border-radius:3.5px;padding:2px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);background:currentColor;border:0;box-shadow:none}
.mdie i{width:2.6px;height:2.6px;border-radius:50%;background:#0E141A;place-self:center}
.mdie.r{transform:rotate(12deg) translateY(3px)}
.mdie:not(.r){transform:rotate(-10deg) translateY(-2px)}
.wz-opt .mdie,.hub-card .mdie{width:20px;height:20px}
@media (prefers-reduced-motion:no-preference){
  .mdie.rolling{animation:mdieRoll .65s cubic-bezier(.3,1.4,.5,1)}
  .mdie.r.rolling{animation:mdieRollR .7s cubic-bezier(.3,1.4,.5,1)}}
@keyframes mdieRoll{0%{transform:rotate(-10deg) translateY(-2px)}30%{transform:translate(-4px,-16px) rotate(-200deg) scale(1.15)}60%{transform:translate(-2px,0) rotate(-340deg)}80%{transform:translate(-1px,-5px) rotate(-360deg)}100%{transform:rotate(-370deg) translateY(-2px)}}
@keyframes mdieRollR{0%{transform:rotate(12deg) translateY(3px)}30%{transform:translate(5px,-18px) rotate(220deg) scale(1.15)}60%{transform:translate(2px,3px) rotate(350deg)}80%{transform:translate(1px,-3px) rotate(365deg)}100%{transform:rotate(372deg) translateY(3px)}}
.champ .suit-dice{display:flex;gap:6px;right:-4px;top:-6px;opacity:.12}
.champ .suit-dice .mdie{width:48px;height:48px;border-radius:10px;padding:6px;background:var(--ink)}
.champ .suit-dice .mdie i{width:8px;height:8px;background:var(--surface)}
/* Dés */
.dice-layer{position:fixed;inset:0;z-index:50;pointer-events:none;transition:opacity .35s}
.dice-layer.out{opacity:0}
.die{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:14px;padding:9px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  background:linear-gradient(145deg,#FFFDF7,#E6DDC9);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.8),0 14px 26px -8px rgba(0,0,0,.75)}
.die i{width:11px;height:11px;border-radius:50%;background:#16181C;place-self:center;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.die.red{background:linear-gradient(145deg,#D2463D,#8C2027);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.25),0 14px 26px -8px rgba(0,0,0,.75)}
.die.red i{background:#FFF7E6;box-shadow:none}
.dice-sum{position:absolute;left:50%;top:calc(42% + 52px);transform:translateX(-50%);font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--gold-2);background:rgba(10,13,15,.85);border:1px solid rgba(210,172,103,.4);padding:4px 14px;border-radius:999px;animation:sumIn .3s ease both}
@keyframes sumIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* Profil / rejoindre */
.join{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6vh}
.join .name{font-family:var(--f-display);font-weight:900;font-stretch:68%;letter-spacing:.01em;color:var(--title);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.chipstack.big{transform:scale(1.8);margin-top:20px}
.join-card{width:100%;max-width:420px;margin-top:26px;text-align:left;border-color:rgba(210,172,103,.3);box-shadow:var(--glow-gold)}
.me-card{background:linear-gradient(150deg,rgba(91,26,42,.55),var(--surface) 70%);border-color:rgba(210,172,103,.3)}
.me-card .avatar{width:48px;height:48px;font-size:18px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.auth-tabs button{padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:var(--surface-3);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.auth-tabs button[disabled]{opacity:.45;cursor:default}
.auth-err{min-height:18px;margin-top:10px;font-size:13px;font-weight:600;color:var(--loss)}
.pseudo{background:transparent;border-color:transparent;font-family:var(--f-display);font-weight:700;font-size:19px;padding:2px 0;color:var(--ink)}
.pseudo:hover,.pseudo:focus{border-color:var(--line);padding:2px 6px}
.invite ol{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.invite li::marker{color:var(--gold);font-family:var(--f-mono)}
.mini-clock{background:radial-gradient(ellipse at 30% 20%,#17684D,var(--felt) 55%,var(--felt-2));border:1px solid rgba(210,172,103,.3);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow),inset 0 0 30px rgba(0,0,0,.4)}
.mc-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini-clock .time{font-weight:700;font-size:clamp(38px,11vw,50px);line-height:1;color:var(--gold-2);text-shadow:0 0 18px rgba(240,214,156,.3)}
.mc-bl{text-align:right;display:flex;flex-direction:column;gap:1px}
.mc-bl .eyebrow{color:rgba(237,229,211,.6)}
.mc-bl b{font-size:20px;color:var(--ink)}
.mc-bl small{font-size:11px;color:rgba(237,229,211,.6)}
.mini-clock .progress{margin-top:12px}
.mc-ctrl{display:flex;gap:8px;margin-top:12px;align-items:center}
.mc-ctrl .btn.icon{background:rgba(0,0,0,.3);border-color:rgba(240,214,156,.25);font-size:22px}
/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(12,15,18,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(210,172,103,.2);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);border-radius:10px}
nav.tabs button.on{color:var(--gold-2)}
nav.tabs button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#E7C888,var(--gold));color:#1E1608;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:20;max-width:calc(100% - 32px);box-shadow:0 10px 30px -8px rgba(0,0,0,.8)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:no-preference){.btn,.item,.qa,.champ{transition:transform .12s ease,background .15s,border-color .15s}.qa:active,.btn:active{transform:scale(.97)}
  .rise{animation:rise .5s ease both}.rise.d2{animation-delay:.06s}.rise.d3{animation-delay:.12s}.rise.d4{animation-delay:.18s}}
#app.settled .rise{animation:none}
button.chipstack{padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:no-preference){
  .chipstack.gather i:nth-child(1){animation:chipA .9s cubic-bezier(.22,1.25,.4,1) both}
  .chipstack.gather i:nth-child(2){animation:chipB .9s cubic-bezier(.22,1.25,.4,1) .12s both}
  .chipstack.gather i:nth-child(3){animation:chipC .75s cubic-bezier(.3,1.5,.45,1) .38s both}
  .chipstack.gather{animation:stackLand .35s ease-out 1.02s}}
@keyframes chipA{0%{translate:-90px 30px;rotate:-220deg;opacity:0}60%{opacity:1}100%{translate:0 0;rotate:0deg;opacity:1}}
@keyframes chipB{0%{translate:90px 40px;rotate:200deg;opacity:0}60%{opacity:1}100%{translate:0 0;rotate:0deg;opacity:1}}
@keyframes chipC{0%{translate:0 -110px;rotate:-90deg;opacity:0}50%{opacity:1}100%{translate:0 0;rotate:0deg;opacity:1}}
@keyframes stackLand{0%{translate:0 0}40%{translate:0 3px}100%{translate:0 0}}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}

/* =====================================================================
   THÈME « SPORT » : clair, bleu franc, cartes blanches, titres très gras
   ===================================================================== */
:root{
  color-scheme:light;
  --bg:#E8EEF7; --bg-2:#F3F6FB; --surface:#FFFFFF; --surface-2:#EEF3FB; --surface-3:#DCE6F7;
  --ink:#0B1D45; --muted:#5D6B87; --line:#DCE3EE; --line-soft:transparent;
  --blue:#1652D9; --blue-2:#0B3AA8; --blue-3:#0A2A78; --blue-soft:#DCE7FB;
  --red:#E3173E; --green:#22A447;
  --gold:#1652D9; --gold-2:#0B3AA8; --gold-deep:#9BB6EE;
  --felt:#127A4B; --felt-2:#0C5A36; --felt-ink:#FFFFFF;
  --velvet:#1652D9; --velvet-2:#0A2A78;
  --chip:#E3173E; --win:#16A34A; --loss:#E3173E; --warn:#E08A00;
  --title:#0B1D45;
  --glow-gold:0 0 0 2px rgba(22,82,217,.35);
  --shadow:0 2px 10px rgba(14,40,96,.08);
  --f-display:"Montserrat",system-ui,sans-serif; --f-body:"Montserrat",system-ui,sans-serif; --f-mono:"Montserrat",system-ui,sans-serif; --f-card:"Montserrat",system-ui,sans-serif;
}
html,body{background:var(--bg)!important}
body{background:var(--bg)!important;color:var(--ink);font-family:var(--f-body);font-feature-settings:"tnum"}
body::before,body::after{display:none!important}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-weight:800}
h1,h2,h3{font-family:var(--f-display);font-weight:900;letter-spacing:-.01em;font-stretch:normal!important;text-shadow:none!important}
h1{font-size:26px;color:var(--ink);background:none;-webkit-background-clip:initial;background-clip:initial}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.eyebrow{color:var(--muted);font-weight:800;letter-spacing:.06em}
.muted{color:var(--muted)}

/* --- Bandeau supérieur bleu --- */
.brand{margin:-18px -16px 16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(100deg,#0A2A78 0%,#1652D9 70%,#2E6BF0 100%);box-shadow:0 6px 18px -8px rgba(10,42,120,.6)}
.brand .name,.join .name,.hub-name{font-family:var(--f-display)!important;font-weight:900!important;font-style:italic;letter-spacing:.02em!important;color:#fff!important;text-shadow:none!important;text-transform:uppercase}
.brand .name{font-size:26px!important}
.grp-switch{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3)!important;color:#fff!important}
.bell{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3)!important;color:#fff}
.bell b{background:var(--red);box-shadow:0 0 0 2px #1652D9}
.top{background:linear-gradient(100deg,#0A2A78,#1652D9);margin:-18px -16px 16px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;border-radius:0}
.top h1,.top .muted,.top .eyebrow{color:#fff!important}
.top .eyebrow{opacity:.8}
.top .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}

/* --- Cartes --- */
.card,.list,.stat,.qa,.kind,.stake,.notes,.wz-opt,.inv-sheet .inv,.check{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:var(--shadow)!important}
.list .item,.transfer,.row-wrap{border-color:var(--line)!important}
button.item:hover{background:#F5F8FE}
.banner{background:#FFF7E0;border:1px solid #F4D98A;color:#7A5A00}
.empty{color:var(--muted)}

   DESIGN ENRICHI : formes (biseaux, losanges, étiquettes inclinées,
   bords de ticket), décor animé — mêmes couleurs, même police
   ===================================================================== */
/* décor : symboles qui flottent en fond */
.suit-sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.suit-sky span{position:absolute;bottom:-60px;font-size:var(--s,28px);color:var(--c,#1652D9);opacity:.07;animation:floatUp var(--d,22s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes floatUp{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-120vh) rotate(var(--r,180deg))}}
#app{position:relative;z-index:1}

/* bandeau bleu : bord inférieur en biais + reflet qui passe */
.brand,.top{clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),0 100%);padding-bottom:26px!important;position:relative;overflow:hidden}
.brand::after,.top::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);background-size:250% 100%;animation:bandShine 6s ease-in-out infinite;pointer-events:none}
.brand::before,.top::before{content:"♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣";position:absolute;right:-20px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:46px;letter-spacing:10px;white-space:nowrap;color:#fff;opacity:.06;pointer-events:none}
@keyframes bandShine{0%,100%{background-position:130% 0}50%{background-position:-30% 0}}
.hub-hero{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),50% 100%,0 calc(100% - 22px));border-radius:0!important;padding-bottom:44px!important}

/* titres de section : étiquette inclinée */
.sec-title h2,section.block>h2,section.block>.row>h2{position:relative;padding:6px 16px 6px 12px;margin-left:4px!important;color:#fff!important;background:linear-gradient(100deg,#0A2A78,#1652D9);transform:skewX(-12deg);border-radius:4px;box-shadow:3px 3px 0 #D2AC67;font-size:13px!important}
.sec-title h2>*,section.block>h2>*{transform:skewX(12deg)}
.sec-title h2::before,section.block>h2::before,section.block>.row>h2::before{display:none!important}
@media (prefers-reduced-motion:no-preference){.sec-title h2,section.block>h2,section.block>.row>h2{animation:tagIn .5s cubic-bezier(.2,1.3,.4,1) both}}
@keyframes tagIn{from{transform:skewX(-12deg) translateX(-30px);opacity:0}to{transform:skewX(-12deg);opacity:1}}
.sec-title::after{height:2px!important;background:repeating-linear-gradient(90deg,#C9D6EE 0 8px,transparent 8px 14px)!important;transform:none!important;animation:none!important}

/* cartes à coins biseautés */
.qa,.kind,.stake,.stat,.wz-bl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);border-radius:4px!important;box-shadow:none!important;border:1.5px solid #D5DFEF!important}
.qa,.kind{position:relative;overflow:hidden}
.qa::after,.kind::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,#D2AC67 50%)}
.kind.on::after{background:linear-gradient(135deg,transparent 50%,#1652D9 50%)}

/* icônes : losanges (cartes à jouer) */
.qa .ic,.kind .ic{border-radius:10px!important;transform:rotate(45deg);width:46px!important;height:46px!important;margin:6px auto 4px}
.qa .ic>*,.kind .ic>*{transform:rotate(-45deg)}
.qa .ic:not(.dice-ic),.kind .ic:not(.dice-ic){font-size:0}
.qa .ic:not(.dice-ic)::before,.kind .ic:not(.dice-ic)::before{content:attr(data-s);font-size:22px;transform:rotate(-45deg);display:block}
.dice-ic .mdie{transform:rotate(-45deg)!important}

@keyframes bob{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translate(-3px,-3px)}}

/* listes : bord de ticket perforé à gauche */
.list{position:relative;border-left:0!important}
.list::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:radial-gradient(circle at 0 50%,var(--bg) 4px,transparent 4.5px) 0 0/6px 16px repeat-y,linear-gradient(180deg,#1652D9,#0A2A78);z-index:1}

.date-tile{border:0!important;border-radius:6px!important;background:#fff!important;box-shadow:0 2px 6px rgba(14,40,96,.18),inset 0 0 0 1.5px #D5DFEF!important;position:relative;transform:rotate(-4deg)}

/* pastilles inclinées */
.pill,.chip{border-radius:4px!important;transform:skewX(-10deg)}
.pill>*,.chip>*{transform:skewX(10deg)}

/* table : cadre au contour animé or/bleu/rouge + bandeau incliné */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.table-wrap{position:relative;isolation:isolate}
.table-wrap::before{content:""!important;position:absolute;inset:-3px!important;height:auto!important;border-radius:inherit;padding:3px!important;background:conic-gradient(from var(--ang),#D2AC67,#1652D9,#E3173E,#D2AC67)!important;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1;pointer-events:none;display:block!important}
@media (prefers-reduced-motion:no-preference){.table-wrap::before{animation:spinBorder 6s linear infinite}}

.table-wrap::after{content:"●  PROCHAINE PARTIE";position:absolute;left:0;top:0;right:40%;height:28px;display:flex;align-items:center;padding:0 13px;background:linear-gradient(90deg,#E3173E,#F0365A);color:#fff;font-family:var(--f-display);font-weight:900;font-size:10.5px;letter-spacing:.07em;z-index:3;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);border-top-left-radius:inherit}
.live-table::after{content:"●  EN DIRECT"}

/* avatars de la liste : cadre doré qui tourne au toucher */

.sec-title h2,section.block>h2,section.block>.row>h2{width:fit-content;max-width:100%;align-self:flex-start;flex:none}
