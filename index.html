<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const COLORS=["#8C2F39","#1F6B52","#2E5B8A","#9A6B2F","#5E3A8C","#1C6F73","#8A3A6A","#56662A"];
const S={data:{players:{},games:{},meta:{},groups:{}},groupId:(()=>{try{return localStorage.getItem("tapisvert-group")}catch(e){return null}})(),hub:null,mode:"loading",canWrite:true,me:{id:null,name:"",avatarUrl:""},isOwner:false,auth:"checking",account:null,tab:"games",gameId:null,confirm:null,
  timer:loadTimer()};
const pending={};
let db=null,needsRender=false;
const app=document.getElementById("app");

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const meta=()=>{const g=curGroup();return g?{name:g.name||"Mon groupe",currency:g.currency||"$"}:{name:"Kicker",currency:"$"}};
const cur=()=>meta().currency||"$";
const n=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:0};
function money(v,signed){const a=Math.abs(v);const s=a.toLocaleString("fr-FR",{maximumFractionDigits:2});
  const sign=signed?(v>0.004?"+":v<-0.004?"−":""):(v<0?"−":"");return sign+s+" "+cur();}
function colorFor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function avatar(pid){const p=S.data.players[pid];const nm=p?p.name:"?";return `<span class="avatar" style="background:${colorFor(pid)}">${esc(nm.trim().charAt(0).toUpperCase()||"?")}</span>`}
const pname=pid=>S.data.players[pid]?.name||"Joueur supprimé";
function dateParts(d){if(!d)return{day:"?",mon:""};const dt=new Date(d+"T12:00:00");return{day:dt.getDate(),mon:dt.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")}}
function longDate(g){if(!g.date)return"Date à fixer";const dt=new Date(g.date+"T12:00:00");
  let s=dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});s=s.charAt(0).toUpperCase()+s.slice(1);
  return g.time?s+" · "+g.time.replace(":","h"):s}
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;t.classList.remove("out","in");void t.offsetWidth;t.classList.add("in");clearTimeout(toast._t);clearTimeout(toast._h);toast._t=setTimeout(()=>{t.classList.add("out");toast._h=setTimeout(()=>t.hidden=true,260)},2400)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copié — colle-le dans ton groupe")}catch(e){
  S.copyFallback=text;render(true);}}

/* ---------- stockage : Supabase ---------- */
const SB_URL="https://qswhsawqhesobdyqcnvq.supabase.co";
const SB_KEY="sb_publishable_PELSbEu3ZWpMG_VZ5GdCiw_KE2KhzPv";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const TABLES=["players","games","groups"];
function sbRow(coll,id,data){const r={id,data,updated_at:new Date().toISOString()};if(coll==="games")r.group_id=data.groupId||null;if(coll==="groups")r.code=data.code||null;return r}
const LOCAL_TS={};
function saveState(st){const el=document.getElementById("savebadge");if(!el)return;clearTimeout(saveState.t);el.className="savebadge "+st;el.textContent=st==="saving"?"Enregistrement…":st==="saved"?"Enregistré":"Hors ligne";el.hidden=false;if(st==="saved")saveState.t=setTimeout(()=>el.hidden=true,1400)}
const isObj=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
function jdiff(a,b,path,ops){
  if(isObj(a)&&isObj(b)){
    for(const k in a)if(b[k]===undefined)ops.push({p:path.concat(k),del:1});
    for(const k in b){if(b[k]===undefined)continue;if(a[k]===undefined)ops.push({p:path.concat(k),v:b[k]});else jdiff(a[k],b[k],path.concat(k),ops)}
    return ops}
  if(JSON.stringify(a)===JSON.stringify(b))return ops;
  const an=a===""||a==null?0:+a,bn=+b;
  if(path[0]==="seats"&&path[path.length-1]==="in"&&typeof b==="number"&&isFinite(an)&&isFinite(bn))ops.push({p:path,add:Math.round((bn-an)*100)/100});
  else ops.push({p:path,v:b===undefined?null:b});
  return ops}
function write(coll,id,data,silent){
  const prev=S.data[coll][id];
  if(data===null)delete S.data[coll][id];else S.data[coll][id]=data;
  if(!silent)render(true);
  const path=coll+"/"+id;const p=pending[path]||(pending[path]={});LOCAL_TS[path]=Date.now();saveState("saving");
  if(coll==="games"&&data!==null&&prev&&!p.full&&p.data!==null){(p.ops||(p.ops=[])).push(...jdiff(prev,data,[],[]))}else{p.full=true;p.ops=[]}
  p.data=data===null?null:clone(data);p.dirty=true;clearTimeout(p.t);p.t=setTimeout(()=>flush(path),data===null?0:350);
}
async function flush(path){
  const p=pending[path];if(!p||p.inflight||!p.dirty)return;
  p.inflight=true;p.dirty=false;const data=p.data;const [coll,id]=path.split("/");
  try{
    if(data===null){const {data:del,error}=await sb.from(coll).delete().eq("id",id).select("id");if(error)throw error;
      if(!del||!del.length){const {data:still}=await sb.from(coll).select("id").eq("id",id);
        if(still&&still.length){toast("Suppression refusée par le serveur. Réessaie ou demande à l’organisateur.");p.inflight=false;delete pending[path];loadAll().then(()=>render(true)).catch(()=>{});return}}}
    else if(coll==="games"&&!p.full){const ops=p.ops||[];p.ops=[];
      if(ops.length){const {data:srv,error}=await sb.rpc("game_apply",{p_id:id,p_ops:ops});
        if(error){p.ops=ops.concat(p.ops);throw error}
        if(srv==null){const {error:e2}=await sb.from(coll).insert(sbRow(coll,id,data));if(e2){p.full=true;throw e2}}
        else if(!p.dirty&&S.data.games[id]){S.data.games[id]=srv;render()}}}
    else{const full=p.full;p.full=false;const row=sbRow(coll,id,data);const {data:upd,error}=await sb.from(coll).update(row).eq("id",id).select("id");if(error){p.full=full;throw error}
      if(!upd||!upd.length){const {error:e2}=await sb.from(coll).insert(row);if(e2){p.full=full;throw e2}}}
  }catch(e){console.warn(e);saveState("error");if(data!==null&&!(e&&e.code==="23505")&&(p.retry=(p.retry||0)+1)<=3){p.inflight=false;p.dirty=true;clearTimeout(p.t);p.t=setTimeout(()=>flush(path),2500*p.retry);return}toast(e&&e.code==="23505"?"Ce code existe déjà, réessaie.":"Échec de l’enregistrement. Vérifie ta connexion.")}
  p.inflight=false;if(p.dirty)flush(path);else{delete pending[path];if(!Object.keys(pending).length)saveState("saved")}
}
async function loadAll(){
  for(const t of TABLES){const {data,error}=await sb.from(t).select("id,data");if(error)throw error;
    const o={};(data||[]).forEach(r=>{o[r.id]=r.data});
    for(const path in pending){const [c,id]=path.split("/");if(c!==t)continue;if(pending[path].data===null)delete o[id];else o[id]=pending[path].data}
    S.data[t]=o}
}
let sbChannel=null;
function subscribeAll(){
  if(sbChannel)return;sbChannel=sb.channel("kicker-live");
  TABLES.forEach(t=>sbChannel.on("postgres_changes",{event:"*",schema:"public",table:t},pl=>{
    const id=(pl.new&&pl.new.id)||(pl.old&&pl.old.id);if(!id||pending[t+"/"+id])return;
    if(pl.new&&pl.new.updated_at&&LOCAL_TS[t+"/"+id]&&Date.parse(pl.new.updated_at)<LOCAL_TS[t+"/"+id]-50)return;
    if(pl.eventType!=="DELETE"&&S.data[t][id]&&JSON.stringify(S.data[t][id])===JSON.stringify(pl.new.data))return;
    const isNew=t==="games"&&pl.eventType==="INSERT"&&!S.data.games[id];
    if(pl.eventType==="DELETE")delete S.data[t][id];else S.data[t][id]=pl.new.data;
    if(isNew&&document.hidden&&pendingInvites().some(g=>g.id===id))sysNotify(Object.assign({id},pl.new.data));
    render()}));
  sbChannel.subscribe();
  document.addEventListener("visibilitychange",()=>{if(document.hidden){S.hiddenAt=Date.now();return}
    if(S.auth==="ok"&&fidGet()&&S.hiddenAt&&Date.now()-S.hiddenAt>5*60*1000){sb.auth.getSession().then(({data})=>{if(data&&data.session){S.pendingUser=data.session.user;S.auth="locked";S.me={id:null,name:"",avatarUrl:""};render(true);setTimeout(()=>{if(S.auth==="locked")fidUnlock(true)},350)}});return}
    if(!document.hidden&&S.auth==="ok")loadAll().then(()=>render()).catch(()=>{})});
}

/* ---------- domain ---------- */
function gamesSorted(){const gs=Object.entries(S.data.games).filter(([,g])=>g.groupId&&g.groupId===S.groupId).map(([id,g])=>Object.assign({id},g));
  const up=gs.filter(g=>g.status!=="done").sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
  const past=gs.filter(g=>g.status==="done").sort((a,b)=>(b.date||"").localeCompare(a.date||""));return{up,past}}
function seatsOf(g){return g.seats||{}}
function playing(g){return Object.entries(seatsOf(g)).filter(([pid,s])=>s.rsvp==="yes"||n(s.in)>0).map(([pid,s])=>Object.assign({pid},s))}
function results(g){return playing(g).map(s=>({pid:s.pid,in:n(s.in),out:s.out===""||s.out==null?null:n(s.out),net:(s.out===""||s.out==null?0:n(s.out))-n(s.in)}))}
function settle(rs){
  const cred=[],debt=[];rs.forEach(r=>{const v=Math.round(r.net*100)/100;if(v>0)cred.push({pid:r.pid,v});else if(v<0)debt.push({pid:r.pid,v:-v})});
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);const t=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const x=Math.min(debt[i].v,cred[j].v);if(x>0.004)t.push({from:debt[i].pid,to:cred[j].pid,v:Math.round(x*100)/100});
    debt[i].v-=x;cred[j].v-=x;if(debt[i].v<0.005)i++;if(cred[j].v<0.005)j++}return t}
function leaderboard(){
  const m={};const past=gamesSorted().past.filter(g=>g.type!=="board");let biggest=null;
  past.forEach(g=>{const rs=results(g).filter(r=>r.in>0||r.out!=null);if(!rs.length)return;
    const top=rs.reduce((a,b)=>b.net>a.net?b:a);
    rs.forEach(r=>{const e=m[r.pid]||(m[r.pid]={pid:r.pid,net:0,games:0,wins:0,in:0,best:-Infinity});
      e.net+=r.net;e.games++;e.in+=r.in;if(r.net>e.best)e.best=r.net;if(r===top&&r.net>0)e.wins++;
      if(!biggest||r.net>biggest.net)biggest={pid:r.pid,net:r.net,g}});});
  return{rows:Object.values(m).sort((a,b)=>b.net-a.net),biggest,count:past.length}
}
function scoresOf(g){return playing(g).map(s=>({pid:s.pid,score:s.score===""||s.score==null?null:n(s.score)}))}
function winners(g){const sc=scoresOf(g).filter(r=>r.score!=null);if(!sc.length)return[];
  const best=g.lowWins?Math.min(...sc.map(r=>r.score)):Math.max(...sc.map(r=>r.score));return sc.filter(r=>r.score===best).map(r=>r.pid)}
function boardStats(){const m={},games={};const past=gamesSorted().past.filter(g=>g.type==="board");
  past.forEach(g=>{const sc=scoresOf(g).filter(r=>r.score!=null);if(!sc.length)return;const w=winners(g);const nm=(g.gameName||"Jeu").trim();games[nm]=(games[nm]||0)+1;
    sc.forEach(r=>{const e=m[r.pid]||(m[r.pid]={pid:r.pid,games:0,wins:0,byGame:{}});e.games++;if(w.includes(r.pid)){e.wins++;e.byGame[nm]=(e.byGame[nm]||0)+1}})});
  const rows=Object.values(m).sort((a,b)=>b.wins-a.wins||(b.wins/b.games)-(a.wins/a.games));
  const fav=Object.entries(games).sort((a,b)=>b[1]-a[1])[0];return{rows,count:past.length,fav,nGames:Object.keys(games).length}}
const kindLabel=g=>g.type==="board"?(g.gameName||"Jeu de société"):g.type==="tournoi"?"Poker · Tournoi":"Poker · Cash game";

/* ---------- views ---------- */
function banner(){
  if(S.mode==="local")return `<div class="banner">Mode local : les données restent sur cet appareil.</div>`;
  if((S.mode==="shared"||S.mode==="loading-shared")&&!S.canWrite)return `<div class="banner">Lecture seule : seul l’organisateur peut modifier les soirées.</div>`;
  return "";
}
function rsvpCounts(g){const c={yes:0,maybe:0,no:0};Object.values(seatsOf(g)).forEach(s=>{if(c[s.rsvp]!=null)c[s.rsvp]++});return c}
function statusPill(g){return g.status==="live"?`<span class="pill live">En cours</span>`:g.status==="done"?`<span class="pill">Terminée</span>`:`<span class="pill planned">Prévue</span>`}

function countdown(g){if(g.status==="live")return null;if(!g.date)return null;
  const t=new Date(g.date+"T"+(g.time||"20:00")+":00").getTime()-Date.now();if(t<=0)return{over:true};
  return{d:Math.floor(t/864e5),h:Math.floor(t/36e5)%24,m:Math.floor(t/6e4)%60}}
function seatPos(i,N){const ang=(-90+i*360/N)*Math.PI/180;return{x:(50+50*Math.cos(ang)).toFixed(2),y:(50+50*Math.sin(ang)).toFixed(2)}}
function seatSlots(g,pids){const N=Math.max(pids.length,6);const slots=Array(N).fill(null);const set=new Set(pids);const placed=new Set();
  (g.seatOrder||[]).forEach((pid,i)=>{if(pid&&i<N&&set.has(pid)&&!placed.has(pid)&&!slots[i]){slots[i]=pid;placed.add(pid)}});
  pids.forEach(pid=>{if(placed.has(pid))return;const k=slots.indexOf(null);if(k>=0){slots[k]=pid;placed.add(pid)}});return slots}
function logo(cls){const ready=S.auth==="ok"&&S.mode!=="loading"&&S.mode!=="loading-shared";if(ready&&!S.logoT)S.logoT=setTimeout(()=>{S.logoDone=true},2200);
  return `<button class="chipstack ${cls} ${S.logoDone?"":"gather"}" data-act="logo" aria-label="Kicker"><i></i><i></i><i></i></button>`}
function tableHero(next){S.seatSel=null;
  const bulbs=`<b style="animation-delay:-${Date.now()%2400}ms"></b><b style="animation-delay:-${(Date.now()+1200)%2400}ms"></b>`.repeat(7);
  let h=`<div class="table-wrap rise"><div class="marquee">${bulbs}</div><div class="marquee bot">${bulbs}</div>`;
  if(!next){return h+`<div class="oval"><div class="center"><span class="eyebrow">Table libre</span><div class="t">Aucune soirée prévue</div>${S.canWrite?`<button class="btn primary small" data-act="new-game" data-kind="cash" style="margin-top:8px">Ouvrir une table</button>`:""}</div></div></div>`}
  const seats=seatsOf(next);const order={yes:0,maybe:1,no:2};
  const ps=groupPlayers().map(([pid,p])=>({pid,name:p.name,r:seats[pid]?.rsvp||"none"}))
    .sort((a,b)=>((a.r==='none')-(b.r==='none'))||a.name.localeCompare(b.name)).slice(0,10);
  const slots=seatSlots(next,ps.map(p=>p.pid));const N=slots.length;const byPid={};ps.forEach(p=>byPid[p.pid]=p);
  const seatHtml=slots.map((pid,i)=>{if(!pid)return"";const p=byPid[pid];const q=seatPos(i,N);
    return `<button class="seat ${p.r}" data-seat="${p.pid}" data-act="seat-move" data-gid="${next.id}" style="left:${q.x}%;top:${q.y}%" aria-label="Échanger la place de ${esc(p.name)}">${avatar(p.pid)}<em>${esc(p.name.split(" ")[0])}</em></button>`}).join("");
  const cd=countdown(next);const c=rsvpCounts(next);
  let cdh="";if(next.status==="live")cdh=`<span class="pill live" style="margin-top:6px">Partie en cours</span>`;
  else if(cd&&cd.over)cdh=`<span class="pill" style="margin-top:6px">C’est l’heure</span>`;
  else if(cd)cdh=`<div class="count" aria-label="Compte à rebours"><span><b id="cd-d">${cd.d}</b><small>jours</small></span><span><b id="cd-h">${String(cd.h).padStart(2,"0")}</b><small>h</small></span><span><b id="cd-m">${String(cd.m).padStart(2,"0")}</b><small>min</small></span></div>`;
  h+=`<div class="oval">${seatHtml}<div class="center" data-act="${next.status==="live"&&!next.stoppedAt?"open-live":"open-game"}" data-id="${next.id}" role="button" tabindex="0">
      <span class="eyebrow">${esc(kindLabel(next))}</span><div class="t">${esc(next.title||"Soirée jeux")}</div><div class="d">${esc(longDate(next))}</div>${cdh}</div></div>
    <div class="table-meta"><div class="chips"><span class="chip"><i style="background:var(--gold)"></i><b id="cnt-yes" style="font-weight:inherit">${c.yes}</b>&nbsp;à table</span><span class="chip"><i style="background:var(--muted)"></i><b id="cnt-maybe" style="font-weight:inherit">${c.maybe}</b>&nbsp;peut-être</span></div>
    <div class="chips">${next.location?`<span class="chip">${esc(next.location)}</span>`:""}${next.type!=="board"?`<span class="chip num">${money(n(next.buyIn))}</span>`:""}</div></div>
    ${S.me.id&&S.data.players[S.me.id]&&next.status!=="live"?`<div class="my-rsvp"><span class="eyebrow" style="color:var(--gold-2)">Tu viens ?</span><div class="seg">${[["yes","Oui"],["maybe","Peut-être"],["no","Non"]].map(([v,l])=>`<button data-act="rsvp-home" data-id="${next.id}" data-v="${v}" class="${seats[S.me.id]?.rsvp===v?"on":""}">${l}</button>`).join("")}</div></div>`:""}

  else if(g.status==="done"){const rs=results(g);if(rs.length){const top=rs.reduce((a,b)=>b.net>a.net?b:a);right=`<div style="text-align:right"><div class="num win" style="font-weight:700">${money(top.net,true)}</div><div class="muted" style="font-size:12px">${esc(pname(top.pid))}</div></div>`}}

  h+=`<section class="block"><div class="row between"><h2 style="margin:0">Qui vient ?</h2><span class="muted" style="font-size:13px">${c.yes} oui · ${c.maybe} peut-être</span></div>`;

  else{const rs=results(g);const step=n(g.buyIn)||10;
    h+=`<div class="card"><div class="cash"><span class="hd h-who">Joueur</span><span class="hd h-mis" style="text-align:center">Mis</span><span class="hd" style="text-align:right">Jetons fin</span>

function boardMoney(g){return null;const stake=n(g.buyIn);if(stake<=0)return null;const sc=scoresOf(g);if(!sc.length||sc.some(r=>r.score==null))return{stake,pot:stake*sc.length,rs:null};
  const w=winners(g),pot=stake*sc.length,share=pot/w.length;return{stake,pot,rs:sc.map(r=>({pid:r.pid,net:(w.includes(r.pid)?share:0)-stake}))}}
function scoresSection(g,w,dis){
  let h=`<section class="block"><h2 style="margin:0">Scores</h2>`;
  if(g.status==="planned"||!g.status)return h+`<div class="card"><p class="muted" style="margin:0 0 12px">Quand tout le monde est à table, lance la partie pour noter les scores.</p>${w?`<button class="btn primary" data-act="start">Lancer la partie</button>`:""}</div></section>`;
  const sc=scoresOf(g),win=winners(g),filled=sc.filter(r=>r.score!=null).length;
  const order=[...sc].sort((a,b)=>a.score==null?1:b.score==null?-1:g.lowWins?a.score-b.score:b.score-a.score);
  h+=`<div class="list">${order.map(r=>`<div class="item">${avatar(r.pid)}<div class="grow" style="min-width:0"><div class="ellipsis" style="font-weight:600">${esc(pname(r.pid))}</div>${win.includes(r.pid)&&filled===sc.length?`<div style="font-size:12px;font-weight:700;color:var(--gold)">${win.length>1?"Ex æquo":"Vainqueur"}</div>`:""}</div>
    <input id="sc-${r.pid}" type="number" inputmode="decimal" step="any" data-score="${r.pid}" value="${r.score==null?"":r.score}" placeholder="Score" ${dis} style="width:96px;text-align:right;font-family:var(--f-mono)" aria-label="Score de ${esc(pname(r.pid))}"></div>`).join("")}</div>`;
  if(!sc.length)h+=`<div class="card empty">Marque les présents dans « Qui vient ? ».</div>`;
  const bm=boardMoney(g);
  if(bm){h+=`<div class="row wrap" style="gap:8px"><div class="stat grow"><span class="eyebrow">Mise</span><b>${money(bm.stake)}</b></div><div class="stat grow"><span class="eyebrow">Pot</span><b>${money(bm.pot)}</b></div></div>`;
    if(bm.rs){const t=settle(bm.rs);h+=`<h2 style="margin:12px 0 0">Qui paie qui</h2>${t.length?`<div class="list">${t.map(x=>`<div class="transfer">${avatar(x.from)}<span class="ellipsis" style="font-weight:600">${esc(pname(x.from))}</span><span class="arrow">→</span>${avatar(x.to)}<span class="grow ellipsis" style="font-weight:600">${esc(pname(x.to))}</span><span class="num" style="font-weight:700">${money(x.v)}</span></div>`).join("")}</div>`:`<div class="card empty">Personne ne doit rien.</div>`}`}}
  if(filled===sc.length&&sc.length)h+=`<div class="row wrap"><button class="btn small" data-act="copy-results">Copier les résultats</button></div>`;
  if(w)h+=`<div class="row wrap">${g.status==="live"?`<button class="btn primary" data-act="finish" ${filled===sc.length&&sc.length?"":"disabled"}>Terminer la partie</button>${filled<sc.length?`<span class="muted" style="font-size:13px">Saisis le score de chacun pour terminer.</span>`:""}`:`<button class="btn small" data-act="reopen">Modifier les scores</button>`}</div>`;
  return h+`</section>`;
}
function viewBoardGames(h){
  const {rows,count,fav,nGames}=boardStats();
  if(!rows.length)return h+`<div class="card empty">Termine une partie de jeu de société pour voir qui gagne le plus.</div>`;
  const max=Math.max(1,...rows.map(r=>r.wins));
  h+=`<div class="stats"><div class="stat"><span class="eyebrow">Parties</span><b>${count}</b></div><div class="stat"><span class="eyebrow">Jeux</span><b>${nGames}</b></div><div class="stat"><span class="eyebrow">Le plus joué</span><b style="font-family:var(--f-body);font-weight:700" class="ellipsis">${fav?esc(fav[0]):"—"}</b></div></div>`;
  h+=`<section class="block"><div class="list">${rows.map((r,i)=>{const top=Object.entries(r.byGame).sort((a,b)=>b[1]-a[1])[0];
    return `<div class="item"><span class="rank ${i===0?"r1":""}">${i+1}</span>${avatar(r.pid)}<div class="grow" style="min-width:0">
      <div class="row between"><span class="ellipsis" style="font-weight:600">${esc(pname(r.pid))}</span><span class="num" style="font-weight:700">${r.wins} victoire${r.wins>1?"s":""}</span></div>
      <div class="bar"><i style="left:0;width:${r.wins/max*100}%;background:var(--gold)"></i></div>
      <div class="muted" style="font-size:12px;margin-top:4px">${r.games} partie${r.games>1?"s":""} · <span class="num">${Math.round(r.wins/r.games*100)}%</span> de victoires${top?` · fort à ${esc(top[0])}`:""}</div></div></div>`}).join("")}</div></section>`;
  return h;
}
function viewBoard(){
  const {rows,biggest,count}=leaderboard();const max=Math.max(1,...rows.map(r=>Math.abs(r.net)));
  const mode=S.boardMode||"poker";
  let h=`<div class="top"><div><div class="eyebrow">${esc(meta().name)}</div><h1>Classement</h1></div></div>${banner()}
   <div class="seg" style="margin-bottom:14px"><button data-act="bmode" data-m="poker" class="${mode==="poker"?"on":""}" data-v="yes">Poker</button><button data-act="bmode" data-m="board" class="${mode==="board"?"on":""}" data-v="yes">Jeux de société</button></div>`;
  if(mode==="board")return viewBoardGames(h);
  if(!rows.length)return h+`<div class="card empty">Le classement poker se remplit dès qu’une soirée poker est terminée.</div>`;
  const vol=rows.reduce((a,r)=>a+r.in,0);
  h+=`<div class="stats"><div class="stat"><span class="eyebrow">Soirées</span><b>${count}</b></div><div class="stat"><span class="eyebrow">Argent joué</span><b>${money(vol)}</b></div><div class="stat"><span class="eyebrow">Record</span><b class="win">${biggest?money(biggest.net,true):"—"}</b><span class="muted" style="font-size:12px">${biggest?esc(pname(biggest.pid)):""}</span></div></div>`;
  h+=`<section class="block"><div class="list">${rows.map((r,i)=>{const pct=Math.abs(r.net)/max*50;
    return `<div class="item"><span class="rank ${i===0?"r1":""}">${i+1}</span>${avatar(r.pid)}<div class="grow" style="min-width:0">
      <div class="row between"><span class="ellipsis" style="font-weight:600">${esc(pname(r.pid))}</span><span class="num ${r.net>0?"win":r.net<0?"loss":"muted"}" style="font-weight:700">${money(r.net,true)}</span></div>
      <div class="bar"><i style="left:${r.net>=0?50:50-pct}%;width:${pct}%;background:${r.net>=0?"var(--win)":"var(--loss)"}"></i><i style="left:50%;width:1px;background:var(--line)"></i></div>
      <div class="muted" style="font-size:12px;margin-top:4px">${r.games} soirée${r.games>1?"s":""} · ${r.wins} victoire${r.wins>1?"s":""} · ROI <span class="num">${r.in?Math.round(r.net/r.in*100):0}%</span></div></div></div>`}).join("")}</div>
    <p class="muted" style="font-size:12px;margin:0">Victoire = meilleur gain de la soirée. ROI = gains nets ÷ total misé.</p></section>`;
  return h;
}

function isMe(pid){return !!S.me.id&&pid===S.me.id}
function canAnswer(pid){const G=curGroup();return isMe(pid)||!!(G&&G.createdBy===S.me.id)}

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const AUTH_ENABLED=true;
function setSession(){}
/* ---------- Face ID / Touch ID (déverrouillage de l'appareil) ---------- */
const FID_KEY="kicker-faceid";
function fidGet(){try{return JSON.parse(localStorage.getItem(FID_KEY)||"null")}catch(e){return null}}
function fidSet(v){try{if(v)localStorage.setItem(FID_KEY,JSON.stringify(v));else localStorage.removeItem(FID_KEY)}catch(e){}}
function fidSync(v){try{sb.auth.updateUser({data:{fid:v?{id:v.id,on:v.on}:null}}).catch(e=>console.warn(e))}catch(e){}}
function fidRestore(user){const m=user&&user.user_metadata&&user.user_metadata.fid;const f=fidGet();if(m&&m.id&&(!f||f.user!==user.id))fidSet({id:m.id,user:user.id,on:m.on||Date.now()});if(f&&f.user===user.id&&!m)fidSync(f)}
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"==".slice(0,(4-s.length%4)%4)),c=>c.charCodeAt(0));
async function fidAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
function fidLabel(){return /iPhone|iPad|iPod/.test(navigator.userAgent)?"Face ID":/Macintosh/.test(navigator.userAgent)?"Touch ID":"empreinte / visage"}
async function fidEnable(){
  if(!(await fidAvailable())){toast("Ton appareil ne propose pas "+fidLabel()+" pour les sites web.");return false}
  try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Kicker",id:location.hostname},
      user:{id:new TextEncoder().encode(S.me.id),name:(S.account&&S.account.email)||S.me.name,displayName:S.me.name},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
    const fv={id:b64u(cred.rawId),user:S.me.id,on:Date.now()};fidSet(fv);fidSync(fv);try{localStorage.setItem("kicker-fid-asked","1")}catch(e){}S.unlockedAt=Date.now();toast(fidLabel()+" activé : Kicker se déverrouillera avec ton visage");return true}
  catch(e){console.warn(e);toast(e&&e.name==="NotAllowedError"?"Activation annulée.":"Impossible d’activer "+fidLabel()+" ici.");return false}
}
async function fidVerify(){const f=fidGet();if(!f)return true;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64u(f.id),transports:["internal"]}],userVerification:"required",timeout:60000,rpId:location.hostname}});return true}
  catch(e){console.warn(e);return false}}
function fidLocked(user){const f=fidGet();return !!(f&&f.user===user.id&&!S.fresh)}
async function fidUnlock(auto){if(S.fidBusy)return;S.fidBusy=true;const b=app.querySelector('[data-act="fid-unlock"]');if(b){b.disabled=true;b.lastChild.textContent=" Vérification…"}
  const ok=await fidVerify();S.fidBusy=false;
  if(ok){const u=S.pendingUser;S.pendingUser=null;S.fresh=true;S.unlockedAt=Date.now();buzz(15);S.auth="checking";onSignedIn(u);setTimeout(()=>{S.fresh=false},500)}
  else{const bb=app.querySelector('[data-act="fid-unlock"]');if(bb){bb.disabled=false;bb.lastChild.textContent=auto?" Déverrouiller avec "+fidLabel():" Réessayer"}if(!auto)authError("Visage non reconnu ou vérification annulée.")}}
function viewLock(){const L=fidLabel();
  return `<div class="auth-tabs" style="display:none"></div><div class="lock-box"><div class="lock-ic" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 16V10a4 4 0 0 1 4-4h6M32 6h6a4 4 0 0 1 4 4v6M42 32v6a4 4 0 0 1-4 4h-6M16 42h-6a4 4 0 0 1-4-4v-6"/><path d="M17 18v3M31 18v3M24 19v8h-2M18 33c3.5 3 8.5 3 12 0"/></svg></div>
    <h2 style="margin:6px 0 4px">Kicker est verrouillé</h2><p class="muted" style="margin:0 0 16px;font-size:13.5px">Utilise ${L} pour retrouver tes parties.</p>
    <button class="btn primary" data-act="fid-unlock" style="width:100%"><span></span> Déverrouiller avec ${L}</button>
    <div class="auth-err" id="a-err" role="alert">${esc(S.authErr||"")}</div>
    <button class="btn small" data-act="fid-password" style="margin-top:6px;background:transparent!important;border-color:transparent!important">Utiliser mon mot de passe</button></div>`}
async function onSignedIn(user){
  if(S.auth==="ok"&&S.me.id===user.id)return;
  fidRestore(user);
  if(fidLocked(user)){S.pendingUser=user;S.auth="locked";S.authErr="";render(true);setTimeout(()=>{if(S.auth==="locked")fidUnlock(true)},350);return}
  S.me={id:user.id,name:(user.user_metadata&&user.user_metadata.pseudo)||user.email.split("@")[0],avatarUrl:""};
  S.account={email:user.email};S.mode="loading-shared";S.auth="ok";render(true);
  try{await loadAll()}catch(e){console.warn(e);S.auth="error";render(true);return}
  S.mode="shared";subscribeAll();ensurePlayer(S.me.name);render(true);autoJoin();
  fidAvailable().then(av=>{S.fidAvail=av;let asked=false;try{asked=!!localStorage.getItem("kicker-fid-asked")}catch(e){}if(av&&!fidGet()&&!asked){S.fidOffer=true}render(true)});
}
async function initAuth(){
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){S.auth="newpw";S.authErr="";render(true);return}
    if(ev==="SIGNED_IN"&&session&&S.auth!=="newpw")setTimeout(()=>onSignedIn(session.user),0);
    if(ev==="SIGNED_OUT"){S.auth="login";S.me={id:null,name:"",avatarUrl:""};S.data={players:{},games:{},meta:{},groups:{}};render(true)}
  });
  const {data}=await sb.auth.getSession();
  if(S.auth==="newpw")return;
  if(data&&data.session)onSignedIn(data.session.user);else{S.auth="login";render(true)}
}

  else if(S.auth==="signup")body=`<div class="auth-tabs"><button class="on">Créer un compte</button><button data-act="auth-to-login">Se connecter</button></div>

  return `<div class="join rise">${logo("big")}

function authError(msg){S.authErr=msg;const e=document.getElementById("a-err");if(e)e.textContent=msg}
function busy(act,label){const b=app.querySelector(`[data-act="${act}"]`);if(b){b.disabled=!!label;if(label){b.dataset.l=b.textContent;b.textContent=label}else if(b.dataset.l)b.textContent=b.dataset.l}}
function frErr(e){console.warn("Supabase auth error:",e);const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return "Adresse mail ou mot de passe incorrect.";
  if(m.includes("not confirmed"))return "Confirme d’abord ton adresse mail avec le lien reçu.";
  if(m.includes("already registered")||m.includes("already been registered"))return "Un compte existe déjà avec cette adresse. Connecte-toi.";
  if(m.includes("rate limit")||m.includes("too many"))return "Trop d’essais. Attends quelques minutes puis réessaie.";
  if(m.includes("password"))return "Mot de passe trop faible : 8 caractères minimum.";
  if(m.includes("signups not allowed")||m.includes("signup is disabled"))return "Les inscriptions sont désactivées dans Supabase.";
  if(m.includes("invalid api key")||m.includes("apikey"))return "Clé Supabase refusée. Vérifie la clé publishable.";
  if(m.includes("failed to fetch")||m.includes("network"))return "Impossible de joindre Supabase. Vérifie ta connexion.";
  if(m.includes("email address")&&m.includes("invalid"))return "Supabase refuse cette adresse mail. Essaie une vraie adresse.";
  return "Erreur : "+((e&&e.message)||"inconnue")+" (envoie cette phrase à Claude)";}
async function doSignup(){
  const nm=(document.getElementById("a-name").value||"").trim().slice(0,24);const email=(document.getElementById("a-email").value||"").trim().toLowerCase();
  const pw=document.getElementById("a-pw").value,pw2=document.getElementById("a-pw2").value;
  if(!nm)return authError("Choisis un pseudo.");if(!EMAIL_RE.test(email))return authError("Cette adresse mail n’est pas valide.");
  if(pw.length<8)return authError("Le mot de passe doit faire au moins 8 caractères.");if(pw!==pw2)return authError("Les deux mots de passe ne correspondent pas.");
  authError("");busy("auth-signup","Création…");S.authEmail=email;
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{pseudo:nm},emailRedirectTo:location.origin}});
  if(error){busy("auth-signup");return authError(frErr(error))}
  if(data.user&&data.user.identities&&data.user.identities.length===0){busy("auth-signup");return authError("Un compte existe déjà avec cette adresse. Connecte-toi.")}
  if(data.session){S.fresh=true;onSignedIn(data.session.user);setTimeout(()=>{S.fresh=false},800);return}
  S.auth="confirm";S.authErr="";render(true);
}
async function doLogin(){
  const email=(document.getElementById("a-email").value||"").trim().toLowerCase();const pw=document.getElementById("a-pw").value;
  if(!email||!pw)return authError("Entre ton adresse mail et ton mot de passe.");
  authError("");busy("auth-login","Connexion…");S.authEmail=email;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){busy("auth-login");return authError(frErr(error))}
  S.fresh=true;onSignedIn(data.user);setTimeout(()=>{S.fresh=false},800);
}
async function doForgot(){
  const email=(document.getElementById("a-email").value||"").trim().toLowerCase();
  if(!EMAIL_RE.test(email))return authError("Tape d’abord ton adresse mail ci-dessus.");
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  if(error)return authError(frErr(error));
  authError("");toast("Mail envoyé : clique sur le lien pour choisir un nouveau mot de passe.");
}
async function doNewPw(){
  const pw=document.getElementById("a-pw").value,pw2=document.getElementById("a-pw2").value;
  if(pw.length<8)return authError("Le mot de passe doit faire au moins 8 caractères.");if(pw!==pw2)return authError("Les deux mots de passe ne correspondent pas.");
  busy("auth-newpw","Enregistrement…");const {data,error}=await sb.auth.updateUser({password:pw});
  if(error){busy("auth-newpw");return authError(frErr(error))}
  S.auth="checking";toast("Mot de passe mis à jour");S.fresh=true;onSignedIn(data.user);setTimeout(()=>{S.fresh=false},800);
}
function ensurePlayer(pseudo){if(S.mode==='loading-shared')return;const id=S.me.id;if(!id||S.data.players[id])return;
  write("players",id,{name:(pseudo||"Joueur").slice(0,24),userId:S.mode==="shared"?id:null,joinedAt:Date.now()});
  gamesSorted().up.forEach(g=>{if(!(g.seats||{})[id]){const c=clone(S.data.games[g.id]);c.seats=c.seats||{};c.seats[id]={rsvp:"invited"};write("games",g.id,c)}});}
/* ---------- lancer de dés ---------- */
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function dieFace(n){return PIPS[n].map(p=>`<i style="grid-area:${Math.ceil(p/3)}/${(p-1)%3+1}"></i>`).join("")}
function miniDice(){return `<span class="mdie">${dieFace(5)}</span><span class="mdie r">${dieFace(3)}</span>`}
function rollIcon(el){if(!el)return;const ds=el.querySelectorAll(".mdie");ds.forEach((d,k)=>{const v=1+Math.floor(Math.random()*6);
  d.classList.remove("rolling");void d.offsetWidth;d.classList.add("rolling");let t=0;
  const iv=setInterval(()=>{d.innerHTML=dieFace(1+Math.floor(Math.random()*6));if(++t>7){clearInterval(iv);d.innerHTML=dieFace(v)}},75)})}
function throwDice(src){
  if(throwDice.busy)return;throwDice.busy=true;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const layer=document.createElement("div");layer.className="dice-layer";layer.setAttribute("aria-hidden","true");
  const W=innerWidth,H=innerHeight;const r=src&&src.getBoundingClientRect?src.getBoundingClientRect():{left:W/2,top:H-120,width:0,height:0};
  const sx=r.left+r.width/2,sy=r.top+r.height/2;const faces=[];
  for(let k=0;k<2;k++){const d=document.createElement("div");d.className="die"+(k?" red":"");d.innerHTML=dieFace(1+Math.floor(Math.random()*6));layer.appendChild(d);faces.push(d)}
  document.body.appendChild(layer);
  const total=faces.map((d,k)=>{const v=1+Math.floor(Math.random()*6);
    const ex=W/2+(k?38:-38)+(Math.random()*30-15),ey=H*0.42+(Math.random()*30-15);
    const midx=(sx+ex)/2+(k?40:-40),midy=Math.min(sy,ey)-H*0.25;const rot=(k?1:-1)*(540+Math.random()*360);
    if(reduce){d.innerHTML=dieFace(v);d.animate([{transform:`translate(${ex-30}px,${ey-30}px)`,opacity:0},{transform:`translate(${ex-30}px,${ey-30}px)`,opacity:1}],{duration:250,fill:"forwards"});return v}
    let t=0;const iv=setInterval(()=>{d.innerHTML=dieFace(1+Math.floor(Math.random()*6));if(++t>9){clearInterval(iv);d.innerHTML=dieFace(v)}},75);
    d.animate([
      {transform:`translate(${sx-30}px,${sy-30}px) rotate(0deg) scale(.5)`,opacity:0},
      {transform:`translate(${midx-30}px,${midy-30}px) rotate(${rot*0.55}deg) scale(1.1)`,opacity:1,offset:.45},
      {transform:`translate(${ex-30}px,${ey-30}px) rotate(${rot*0.9}deg) scale(1)`,offset:.75},
      {transform:`translate(${ex-30+(k?10:-10)}px,${ey-44}px) rotate(${rot*0.97}deg) scale(1)`,offset:.87},
      {transform:`translate(${ex-30+(k?14:-14)}px,${ey-30}px) rotate(${Math.round(rot/90)*90}deg) scale(1)`,opacity:1}
    ],{duration:900+k*120,easing:"cubic-bezier(.25,.7,.3,1)",fill:"forwards"});return v});
  setTimeout(()=>{const s=document.createElement("div");s.className="dice-sum";s.textContent=total[0]+total[1];layer.appendChild(s)},reduce?250:1050);
  setTimeout(()=>{layer.classList.add("out");setTimeout(()=>{layer.remove();throwDice.busy=false},400)},reduce?900:1900);
}
/* ---------- effets & automatisations ---------- */
document.addEventListener("pointerdown",e=>{const btn=e.target.closest("button,.btn,.qa,.kind,.pchip,.hub-card,.item,.live-btn,.wz-bl,.seat");if(!btn||btn.disabled||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  const r=btn.getBoundingClientRect();const d=Math.max(r.width,r.height)*2;const sp=document.createElement("span");sp.className="ripple";sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  if(btn.classList.contains("seat"))return;if(getComputedStyle(btn).position==="static")btn.style.position="relative";
  const w=document.createElement("span");w.className="rip-wrap";w.appendChild(sp);btn.appendChild(w);setTimeout(()=>w.remove(),650)},{passive:true});
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms||12)}catch(e){}}
const REDUCE=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function chipFly(fromEl,toEl,color){if(REDUCE()||!fromEl||!toEl)return;const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  const c=document.createElement("div");c.className="fly-chip";c.style.setProperty("--c",color||"#C0413A");document.body.appendChild(c);
  const x0=a.left+a.width/2-14,y0=a.top+a.height/2-14,x1=b.left+b.width/2-14,y1=b.top+b.height/2-14;
  c.animate([{transform:`translate(${x0}px,${y0}px) scale(.6) rotate(0deg)`,opacity:0},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-70}px) scale(1.1) rotate(200deg)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.7) rotate(380deg)`,opacity:.9}],{duration:620,easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish=()=>{c.remove();toEl.classList.remove("pot-bump");void toEl.offsetWidth;toEl.classList.add("pot-bump")}}
function countUp(el,from,to,fmt){if(!el)return;if(REDUCE()||from===to){el.textContent=fmt(to);return}const t0=performance.now(),d=600;
  (function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

/* ---------- timer ---------- */
function loadTimer(){const def={levels:[[10,20,15],[15,30,15],[25,50,15],[50,100,15],[75,150,15],[100,200,15],[150,300,15],[200,400,15],[300,600,15],[500,1000,15]],idx:0,remaining:900,running:false,endAt:0};
  try{const t=JSON.parse(localStorage.getItem("tapisvert-timer")||"null");if(t&&t.levels&&t.levels.length)return Object.assign(def,t,{running:false})}catch(e){}return def}
function saveTimer(){try{localStorage.setItem("tapisvert-timer",JSON.stringify(S.timer))}catch(e){}}
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function remaining(){const t=S.timer;return t.running?(t.endAt-Date.now())/1000:t.remaining}
function miniTimer(){
  const t=S.timer,L=t.levels[t.idx]||t.levels[0],nx=t.levels[t.idx+1];const tot=L[2]*60;
  let h=`<section class="block" id="mini-timer"><div class="sec-title"><h2>Blindes</h2><span class="muted" style="font-size:13px">Niveau ${t.idx+1}/${t.levels.length}</span></div>
  <div class="mini-clock"><div class="mc-main"><div class="time num" id="t-clock">${fmtT(remaining())}</div>
      <div class="mc-bl"><span class="eyebrow">Blindes</span><b class="num">${L[0].toLocaleString("fr-FR")} / ${L[1].toLocaleString("fr-FR")}</b><small>${nx?`Ensuite ${nx[0]} / ${nx[1]}`:"Dernier niveau"}</small></div></div>
    <div class="progress"><i id="t-bar" style="width:${Math.min(100,(1-remaining()/tot)*100)}%"></i></div>
    <div class="mc-ctrl"><button class="btn icon" data-act="t-prev" ${t.idx?"":"disabled"} aria-label="Niveau précédent">‹</button>
      <button class="btn primary" data-act="t-toggle" style="flex:1">${t.running?"Pause":"Démarrer"}</button>
      <button class="btn icon" data-act="t-next" ${nx?"":"disabled"} aria-label="Niveau suivant">›</button>
      <button class="btn icon" data-act="t-reset" aria-label="Remettre à zéro" style="font-size:16px">↺</button></div></div>
  <button class="btn small" data-act="t-struct" style="align-self:flex-start">${S.showLevels?"Masquer la structure":"Modifier la structure"}</button>`;
  if(S.showLevels)h+=`<div class="card" style="overflow-x:auto"><div class="levels">
    <span class="eyebrow">#</span><span class="eyebrow" style="text-align:right">Petite</span><span class="eyebrow" style="text-align:right">Grosse</span><span class="eyebrow" style="text-align:right">Min</span><span></span><span></span>
    ${t.levels.map((l,i)=>`<span class="num ${i===t.idx?"cur":"muted"}">${i+1}</span><input id="lv-${i}-0" type="number" data-lv="${i}" data-k="0" value="${l[0]}" inputmode="numeric"><input id="lv-${i}-1" type="number" data-lv="${i}" data-k="1" value="${l[1]}" inputmode="numeric"><input id="lv-${i}-2" type="number" data-lv="${i}" data-k="2" value="${l[2]}" inputmode="numeric"><span></span><button class="btn icon" data-act="lv-del" data-i="${i}" aria-label="Supprimer le niveau ${i+1}" style="width:30px;height:30px;min-height:30px;font-size:15px" ${t.levels.length>1?"":"disabled"}>×</button>`).join("")}
  </div><div style="margin-top:10px"><button class="btn small" data-act="lv-add">+ Ajouter un niveau</button></div></div>`;
  return h+`<p class="muted" style="font-size:12px;margin:0">Le timer tourne sur ton téléphone, avec un bip à chaque niveau.</p></section>`;
}
let actx=null,wake=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+0.22)})}catch(e){}}
function setLevel(i){const t=S.timer;t.idx=Math.max(0,Math.min(t.levels.length-1,i));t.remaining=t.levels[t.idx][2]*60;if(t.running)t.endAt=Date.now()+t.remaining*1000;saveTimer();render(true)}
setInterval(()=>{const lc=document.getElementById("live-clock");if(lc&&S.liveId&&S.data.games[S.liveId])lc.textContent=fmtDur(liveElapsed(S.data.games[S.liveId]));const cdd=document.getElementById("cd-m");if(cdd){const g=gamesSorted().up[0];const c=g&&countdown(g);if(c&&!c.over){document.getElementById("cd-d").textContent=c.d;document.getElementById("cd-h").textContent=String(c.h).padStart(2,"0");cdd.textContent=String(c.m).padStart(2,"0")}}
  const t=S.timer;if(!t.running)return;let r=remaining();
  if(r<=0){if(t.idx<t.levels.length-1){beep();t.idx++;t.endAt=Date.now()+t.levels[t.idx][2]*60*1000;saveTimer();render(true);return}
    t.running=false;t.remaining=0;beep();render(true);return}
  const c=document.getElementById("t-clock"),b=document.getElementById("t-bar");if(c)c.textContent=fmtT(r);if(b)b.style.width=Math.min(100,(1-r/(t.levels[t.idx][2]*60))*100)+"%"},250);

  if(act==="fid-password"){S.pendingUser=null;sb.auth.signOut();S.auth="login";render(true);return}
  if(act==="fid-on"){fidEnable().then(()=>render(true));return}
  if(act==="fid-off"){fidSet(null);fidSync(null);toast(fidLabel()+" désactivé");render(true);return}
  if(act==="fid-later"){S.fidOffer=false;try{localStorage.setItem("kicker-fid-asked","1")}catch(e){}render(true);return}
  if(act==="fid-yes"){S.fidOffer=false;try{localStorage.setItem("kicker-fid-asked","1")}catch(e){}fidEnable().then(()=>render(true));return}
  if(act==="logout"){S.gameId=null;S.tab="games";S.groupId=null;sb.auth.signOut();window.scrollTo(0,0);return}
  if(act==="copy-join"){copy(`Je t’invite dans notre groupe « ${meta().name} » sur Kicker pour organiser nos soirées poker et jeux. Je viens de te partager la page par mail : ouvre-la, crée ton profil et dis-nous si tu viens à la prochaine soirée.`);return}
  if(act==="goto-board"){S.tab="board";S.boardMode=b.dataset.m;render(true);window.scrollTo(0,0);return}
  if(act==="new-game"&&b.dataset.kind==="board"&&!b.dataset.rolled){rollIcon(b.querySelector(".dice-ic"));b.dataset.rolled="1";setTimeout(()=>{b.click();delete b.dataset.rolled},720);return}
  if(act==="new-game"){const id=uid();const kind=b.dataset.kind||"cash";const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));
    const seats={};groupPlayers().forEach(([p])=>seats[p]={rsvp:p===S.me.id?"yes":"invited"});
    const sd=smartDefaults(kind);
    write("games",id,{title:sd.title,date:sd.date,time:sd.time,location:sd.location,type:sd.type,buyIn:sd.buyIn,gameName:sd.gameName,lowWins:sd.lowWins,rebuys:sd.rebuys,status:"planned",notes:"",seats,createdAt:Date.now(),groupId:S.groupId,createdBy:S.me.id});
    S.tab="games";S.gameId=id;S.viewAnim="up";render(true);window.scrollTo(0,0);buzz(15);toast(sd.copied?"Partie préparée avec les réglages de la dernière fois ✓":"Partie créée : tout le groupe est invité");return}
  if(act==="set-type"){const v=b.dataset.v;const roll=v==="board";setTimeout(()=>{if(roll)rollIcon(app.querySelector(".kind.j .dice-ic"))},0);updGame(g=>{const wasB=g.type==="board";g.type=v;if(v==="board"&&g.title==="Soirée poker")g.title="Soirée jeux";if(v!=="board"&&g.title==="Soirée jeux")g.title="Soirée poker";if(v==="board"&&!wasB)g.buyIn=0;if(v!=="board"&&wasB&&!n(g.buyIn))g.buyIn=20});return}
  if(act==="set-buy"){const v=n(b.dataset.v);updGame(g=>{g.buyIn=v});return}
  if(act==="seat-move"){if(!S.canWrite){toast("Lecture seule : seul l’organisateur peut modifier.");return}
    const gid=b.dataset.gid,pid=b.dataset.seat;const g=S.data.games[gid];if(!g)return;
    const clearSel=()=>{app.querySelectorAll(".oval .seat.sel").forEach(e=>e.classList.remove("sel"));S.seatSel=null};
    if(!S.seatSel||S.seatSel.gid!==gid){clearSel();S.seatSel={gid,pid};b.classList.add("sel");toast("Touche un 2ᵉ joueur pour échanger leurs places");return}
    if(S.seatSel.pid===pid){clearSel();return}
    const first=S.seatSel.pid;clearSel();
    const pids=[...app.querySelectorAll(".oval [data-seat]")].map(e=>e.dataset.seat);const slots=seatSlots(g,pids);const N=slots.length;
    const i=slots.indexOf(first),j=slots.indexOf(pid);if(i<0||j<0)return;slots[i]=pid;slots[j]=first;
    const c=clone(g);c.seatOrder=slots;write("games",gid,c,true);
    const move=(who,k,cls)=>{const el=app.querySelector(`.oval [data-seat="${who}"]`);if(!el)return;const q=seatPos(k,N);el.style.left=q.x+"%";el.style.top=q.y+"%";
      el.classList.remove("hop","slide");void el.offsetWidth;el.classList.add(cls)};
    move(first,j,"hop");move(pid,i,"hop");return}
  if(act==="logo"){b.classList.remove("gather");void b.offsetWidth;b.classList.add("gather");return}
  if(act==="rsvp-home"){if(!S.canWrite){toast("Lecture seule : seul l’organisateur peut modifier.");return}
    const v=b.dataset.v,gid=b.dataset.id;if(seatsOf(S.data.games[gid])[S.me.id]?.rsvp===v)return;
    const g=clone(S.data.games[gid]);g.seats=g.seats||{};g.seats[S.me.id]=Object.assign({},g.seats[S.me.id],{rsvp:v});
    write("games",gid,g,true);
    b.parentElement.querySelectorAll("button").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});
    const seat=app.querySelector(`[data-seat="${S.me.id}"]`);if(seat){seat.className="seat "+v;void seat.offsetWidth;seat.classList.add("pulse")}
    const c=rsvpCounts(g);const cy=document.getElementById("cnt-yes"),cm=document.getElementById("cnt-maybe");if(cy)cy.textContent=c.yes;if(cm)cm.textContent=c.maybe;
    return}
  if(act==="rsvp"){const pid=b.dataset.pid,v=b.dataset.v;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{rsvp:v})});return}
  if(act==="quick-add-disabled"){const inp=document.getElementById("quick-player");const nm=(inp.value||"").trim();if(!nm)return;const pid=uid();
    write("players",pid,{name:nm,createdAt:Date.now()});updGame(g=>{g.seats[pid]={rsvp:"yes"};if(g.status==="live"&&g.type!=="board")g.seats[pid].in=n(g.buyIn)});return}
  if(act==="copy-invite"){copy(inviteText(S.data.games[S.gameId]));return}
  if(act==="copy-results"){copy(resultsText(S.data.games[S.gameId]));return}
  if(act==="start"){const sid=S.gameId;updGame(g=>{g.status="live";g.startedAt=Date.now();g.pausedAt=null;g.pausedTotal=0;if(g.type!=="board")Object.values(g.seats).forEach(s=>{if(s.rsvp==="yes"&&!n(s.in))s.in=n(g.buyIn)})});
    if(!Object.values(seatsOf(S.data.games[sid])).some(s=>s.rsvp==="yes")){toast("Personne n’a répondu oui : marque les présents dans « Qui vient ? ».");return}
    S.liveId=sid;S.gameId=null;render(true);window.scrollTo(0,0);return}
  if(act==="buy"){const pid=b.dataset.pid,d=+b.dataset.d;{const gg=S.data.games[S.gameId],st0=gg&&gg.seats&&gg.seats[pid];if(d>0&&gg&&!rebuyOn(gg)&&st0&&n(st0.in)>=n(gg.buyIn)){toast("Recaves désactivées pour cette soirée");return}}updGame(g=>{const s=g.seats[pid];const step=n(g.buyIn)||10;s.in=Math.max(0,Math.round((n(s.in)+d*step)*100)/100);if(s.in===0&&d<0&&s.rsvp!=="yes")delete g.seats[pid]});return}
  if(act==="finish"){const gid=S.gameId;updGame(g=>{g.status="done"});S.celebrate=gid;const tt=document.getElementById("toast");if(tt)tt.hidden=true;render(true);buzz([20,40,20]);setTimeout(confetti,60);return}
  if(act==="reopen"){updGame(g=>{g.status="live";g.stoppedAt=g.stoppedAt||Date.now()});return}
  if(act==="del-game"){S.confirm="del-game";render(true);return}
  if(act==="del-game-yes"){const id=S.gameId;S.gameId=null;S.confirm=null;write("games",id,null);return}
  if(act==="add-player"){const inp=document.getElementById("new-player");const nm=(inp.value||"").trim();if(!nm){inp.focus();return}
    const pid=uid();write("players",pid,{name:nm,createdAt:Date.now()});
    // add to upcoming games as "peut-être"
    gamesSorted().up.forEach(g=>{if(!(g.seats||{})[pid]){const c=clone(S.data.games[g.id]);c.seats=c.seats||{};c.seats[pid]={rsvp:"maybe"};write("games",g.id,c)}});
    setTimeout(()=>{const i=document.getElementById("new-player");if(i)i.focus()},0);return}
  if(act==="del-player"){S.confirm="del-"+b.dataset.pid;render(true);return}
  if(act==="del-player-yes"){const pid=b.dataset.pid;S.confirm=null;
    gamesSorted().up.forEach(g=>{const s=(g.seats||{})[pid];if(s&&!n(s.in)){const c=clone(S.data.games[g.id]);delete c.seats[pid];write("games",g.id,c)}});
    const G=clone(curGroup());delete G.members[pid];write("groups",S.groupId,G);return}
  if(act==="wipe"){S.confirm="wipe";render(true);return}
  if(act==="hub-mode"){S.hub=b.dataset.v;render(true);setTimeout(()=>{const i=document.getElementById(S.hub==="create"?"hub-name":"hub-code");if(i)i.focus()},0);return}
  if(act==="hub-home"){S.hub=null;render(true);return}
  if(act==="hub-enter"){enterGroup(b.dataset.id);return}
  if(act==="hub-create"){const nm=(document.getElementById("hub-name").value||"").trim();const e=document.getElementById("hub-err");
    if(!nm){e.textContent="Donne un nom à ton groupe.";return}if(!S.me.id){e.textContent="Impossible de t’identifier. Recharge la page.";return}
    ensurePlayer(S.me.name||"Joueur");const id=uid();
    write("groups",id,{name:nm.slice(0,40),code:newCode(),currency:document.getElementById("hub-cur").value,createdBy:S.me.id,createdAt:Date.now(),members:{[S.me.id]:{joinedAt:Date.now()}}},true);
    enterGroup(id);S.tab="players";render(true);toast("Groupe créé ! Envoie le code à tes amis.");return}
  if(act==="hub-join"){const code=(document.getElementById("hub-code").value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");const e=document.getElementById("hub-err");
    if(code.length!==6){e.textContent="Le code fait 6 caractères.";return}
    e.textContent="";b.disabled=true;b.textContent="Recherche…";
    sb.rpc("join_group",{p_code:code}).then(async({data:gid,error})=>{b.disabled=false;b.textContent="Rejoindre le groupe";
      if(error){console.warn("join_group error:",error);e.textContent="Impossible de rejoindre le groupe : "+(error.message||error.code||"erreur inconnue");return}
      if(!gid){e.textContent="Aucun groupe avec ce code. Vérifie auprès de l’organisateur.";return}
      await loadAll();const g=S.data.groups[gid];
      Object.entries(S.data.games).filter(([,x])=>x.groupId===gid&&x.status!=="done"&&!(x.seats||{})[S.me.id]).forEach(([xid,x])=>{const cc=clone(x);cc.seats=cc.seats||{};cc.seats[S.me.id]={rsvp:"invited"};write("games",xid,cc,true)});
      enterGroup(gid);toast("Bienvenue dans « "+(g?g.name:"ton groupe")+" » !")});return}
  if(act==="switch-group"){S.hubForced=true;S.groupId=null;try{localStorage.removeItem("tapisvert-group")}catch(e){}S.hub=null;S.confirm=null;render(true);window.scrollTo(0,0);return}
  if(act==="leave"){S.confirm="leave";render(true);return}
  if(act==="leave-yes"){const G=curGroup();const gid=S.groupId;S.confirm=null;
    if(G.createdBy===S.me.id||S.mode!=="shared"){Object.entries(S.data.games).filter(([,x])=>x.groupId===gid).forEach(([xid])=>write("games",xid,null,true));write("groups",gid,null,true)}
    else{const c=clone(G);delete c.members[S.me.id];write("groups",gid,c,true)}
    S.groupId=null;try{localStorage.removeItem("tapisvert-group")}catch(e){}render(true);window.scrollTo(0,0);return}
  if(act==="copy-code"){const G=curGroup();const link=location.origin+"/?join="+G.code;const txt=`Rejoins mon groupe « ${G.name} » sur Kicker pour nos soirées poker et jeux : ${link}`;
    if(navigator.share){navigator.share({title:"Kicker",text:txt}).catch(()=>{})}else copy(txt);return}
  if(act==="wipe-yes"){S.confirm=null;Object.keys(S.data.games).forEach(id=>write("games",id,null));Object.keys(S.data.players).forEach(id=>write("players",id,null));toast("Données effacées");return}
  if(act==="t-toggle"){const t=S.timer;if(t.running){t.remaining=remaining();t.running=false;try{wake&&wake.release();wake=null}catch(e){}}
    else{if(t.remaining<=0)t.remaining=t.levels[t.idx][2]*60;t.endAt=Date.now()+t.remaining*1000;t.running=true;
      try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
      try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wake=l).catch(()=>{})}catch(e){}}
    saveTimer();render(true);return}
  if(act==="t-next"){setLevel(S.timer.idx+1);return}
  if(act==="t-prev"){setLevel(S.timer.idx-1);return}
  if(act==="t-reset"){S.timer.running=false;setLevel(0);return}
  if(act==="lv-add"){const L=S.timer.levels,l=L[L.length-1];L.push([l[1],l[1]*2,l[2]]);saveTimer();render(true);return}
  if(act==="lv-del"){const i=+b.dataset.i;S.timer.levels.splice(i,1);if(S.timer.idx>=S.timer.levels.length)S.timer.idx=S.timer.levels.length-1;saveTimer();render(true);return}
});
app.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
  if(e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return}
  if(e.target.id==="hub-name"){e.preventDefault();app.querySelector('[data-act="hub-create"]').click();return}
  if(e.target.id==="hub-code"){e.preventDefault();app.querySelector('[data-act="hub-join"]').click();return}
  if(/^a-/.test(e.target.id||"")){e.preventDefault();const bt=app.querySelector('[data-act="auth-signup"],[data-act="auth-login"],[data-act="auth-newpw"]');if(bt)bt.click();return}
  if(e.target.id==="new-player"){e.preventDefault();app.querySelector('[data-act="add-player"]').click()}
  if(e.target.id==="quick-player"){e.preventDefault();app.querySelector('[data-act="quick-add"]').click()}});
app.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.score){const pid=el.dataset.score;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{score:el.value===""?null:n(el.value)})});return}
  if(el.dataset.g==="rebuys"){const on=el.checked;const sw=el.closest(".rb-switch");if(sw){sw.querySelector(".rb-no").classList.toggle("on",!on);sw.querySelector(".rb-yes").classList.toggle("on",on)}const h=document.getElementById("rb-hint");if(h)h.textContent=on?"Montant de chaque buy-in et de chaque recave.":"Montant du buy-in. Recaves désactivées.";buzz(10);
    const g=clone(S.data.games[S.gameId]);g.rebuys=on;write("games",S.gameId,g,true);clearTimeout(S.rbT);S.rbT=setTimeout(()=>render(true),260);return}
  if(el.dataset.g){const k=el.dataset.g;const v=k==="buyIn"?n(el.value):(k==="lowWins"||k==="rebuys")?el.checked:el.value;updGame(g=>{g[k]=v});return}
  if(el.dataset.out){const pid=el.dataset.out;updGame(g=>{g.seats[pid]=Object.assign({},g.seats[pid],{out:el.value===""?null:n(el.value)})});return}
  if(el.dataset.pname){const nm=el.value.trim();if(!nm){render(true);return}write("players",el.dataset.pname,Object.assign({},S.data.players[el.dataset.pname],{name:nm}));return}
  if(el.dataset.meta){const G=curGroup();if(!G)return;write("groups",S.groupId,Object.assign({},G,{[el.dataset.meta]:el.value.trim()||G[el.dataset.meta]}));return}
  if(el.dataset.lv!=null){const i=+el.dataset.lv,k=+el.dataset.k;const v=Math.max(k===2?1:0,Math.round(n(el.value)));S.timer.levels[i][k]=v;
    if(i===S.timer.idx&&k===2&&!S.timer.running)S.timer.remaining=v*60;saveTimer();render(true);return}
});

/* ---------- boot ---------- */
render(true);
initAuth().catch(e=>{console.warn(e);S.auth="error";render(true)});
})();
</script>

</body>
